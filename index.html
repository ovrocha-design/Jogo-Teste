<script>
'use strict';
/* ==========================================================================
   SOBREVIVÊNCIA NA SELVA (jogo 1 — prévia)
   Setas: andar · Enter: pegar/usar · Shift+Tab: trocar · C: construir · R: roupas · F: fogo · E: comer · P: pausa · M: som
   ========================================================================== */

const PX = 40, W = 1024, H = 640;           // 40 pixels por metro; tela 1024 x 640
const ML = 48, MA = 34;                      // mundo de 48 x 34 metros (a ilha e a vila do outro lado)
const DIA = 420, HORA_INICIAL = 7.5;         // um dia dura 7 minutos
const VEL = 4.0, ESC_CHAO = 1.5;
const GOLPE = 0.42;                          // tempo de cada machadada / martelada
const FONTE = '"Segoe UI", "Segoe UI Emoji", system-ui, sans-serif';
const UI = {
  painel: 'rgba(16, 27, 24, 0.94)',
  painelInterno: 'rgba(25, 39, 33, 0.96)',
  borda: 'rgba(210, 224, 190, 0.24)',
  ouro: '#e2c879',
  texto: '#f3f1e5',
  suave: '#b8c5b2',
  verde: '#9bd08a',
  perigo: '#f08072',
};
const INICIO = { x: 14.8, y: 13.6 };
const SKID = [25.5, 6.0, 14.0, 11.2];        // rastro do avião arrastando no chão

const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
const etapa2Frame = document.getElementById('etapa-2');
const toqueAtivo = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
let escala = 1, dpr = 1;

/* ---------------- utilidades ---------------- */

let semente = 1;
function rnd() {
  semente = (semente + 0x6D2B79F5) | 0;
  let t = Math.imul(semente ^ (semente >>> 15), 1 | semente);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const lerp = (a, b, t) => a + (b - a) * t;
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy), 0, 1);
  return dist(px, py, x1 + dx * t, y1 + dy * t);
}
const fonte = (px, peso = 'normal') => `${peso} ${px}px ${FONTE}`;

function circ(x, y, r, cor) { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill(); }
function elip(x, y, rx, ry, cor, rot = 0) { ctx.fillStyle = cor; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); ctx.fill(); }
function lin(x1, y1, x2, y2, cor, esp) { ctx.strokeStyle = cor; ctx.lineWidth = esp; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poli(pts, cor, borda, esp = 1) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (cor) { ctx.fillStyle = cor; ctx.fill(); }
  if (borda) { ctx.strokeStyle = borda; ctx.lineWidth = esp; ctx.stroke(); }
}
function sombra(x, y, rx, ry, a = 0.28) { elip(x, y, rx, ry, `rgba(15,35,10,${a})`); }
function caixa(x, y, w, h, r, cor, borda, esp = 1.5) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (cor) { ctx.fillStyle = cor; ctx.fill(); }
  if (borda) { ctx.strokeStyle = borda; ctx.lineWidth = esp; ctx.stroke(); }
}
function painelUI(x, y, w, h, destaque = false) {
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.28)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  caixa(x, y, w, h, 9, UI.painel, destaque ? UI.ouro : UI.borda, destaque ? 2 : 1);
  ctx.restore();
}
function txt(t, x, y, px, cor, peso = 'normal', alinha = 'left', contorno = null, base = 'alphabetic') {
  ctx.font = fonte(px, peso); ctx.textAlign = alinha; ctx.textBaseline = base;
  if (contorno) { ctx.strokeStyle = contorno; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = cor; ctx.fillText(t, x, y);
}
function quebrar(t, larg, px, peso = 'normal') {
  ctx.font = fonte(px, peso);
  const linhas = []; let atual = '';
  for (const p of t.split(' ')) {
    const tent = atual ? atual + ' ' + p : p;
    if (ctx.measureText(tent).width > larg && atual) { linhas.push(atual); atual = p; } else atual = tent;
  }
  if (atual) linhas.push(atual);
  return linhas;
}

/* ---------------- dados do jogo ---------------- */

const ICONE_REC = { madeira: '🪵', pedra: '🪨', cipo: '🌿', ervas: '🌱', plastico: '🛍️', comida: '🍖' };
const NOME_REC = { madeira: 'madeira', pedra: 'pedra', cipo: 'cipó', ervas: 'ervas', plastico: 'plástico', comida: 'comida' };

const FERR = {
  maos:     { nome: 'Mãos', icone: '✋' },
  machado:  { nome: 'Machado', icone: '🪓', artigo: 'um', balao: ['🪓', '+', '🌳', '=', '🪵'], cena: 'cortar',
              dica: 'Encoste numa árvore e aperte Enter: o machado corta sozinho e a madeira vai para a mochila.' },
  vara:     { nome: 'Vara de pescar', icone: '🎣', artigo: 'uma', balao: ['🎣', '+', '🌊', '=', '🐟'], cena: 'pescar',

  faca:     { nome: 'Faca', icone: '🔪', artigo: 'uma', balao: ['🔪', '+', '🤫', '+', '🦫', '=', '🍖'], cena: 'faca',
              dica: 'Com a faca na mão você anda de mansinho. Chegue por TRÁS da capivara e aperte Enter.' },
  martelo:  { nome: 'Martelo', icone: '🔨', artigo: 'um', balao: ['🔨', '+', '🪵', '=', '⛺'], cena: 'construir',

              dica: 'Vire para a capivara e aperte Enter: a flecha vai sozinha até ela.' },
  isqueiro: { nome: 'Isqueiro', icone: 'isqueiro', artigo: 'um', balao: ['isqueiro', '+', '🪵', '=', '🔥'], cena: 'fogo',
              dica: 'Com 3 madeiras, aperte F para fazer uma fogueira. Perto dela você recupera vida ❤️.' },
  remedio:  { nome: 'Remédio', icone: '💊', artigo: 'um', balao: ['🤕', '+', '💊', '=', '❤️'], cena: 'remedio',
              dica: 'Ele cura! Quando a vida ❤️ ficar baixa, troque para o remédio (Shift+Tab) e aperte Enter. São 2 doses.' },
  remo:     { nome: 'Remo', icone: 'remo', artigo: 'um', balao: ['remo', '+', '🛶', '=', '🏘️'],
              dica: 'Carregue a canoa até a beira do rio e aperte Enter: você rema até a vila.' },
};

const ESCONDIDOS = [
  { id: 'mala', x: 16.4, y: 15.0, pilha: 'mala' },
  { id: 'machado', x: 14.7, y: 11.9, pilha: 'pedacos' },
  { id: 'faca', x: 17.4, y: 12.6, pilha: 'pedacos' },
  { id: 'mochila', x: 9.4, y: 13.6, pilha: 'mochila' },
  { id: 'remedio', x: 13.8, y: 9.0, pilha: 'kit' },
  { id: 'caixote', x: 20.8, y: 10.6, pilha: 'caixote' },
  { id: 'corda', x: 7.2, y: 12.2, pilha: 'corda' },
  { id: 'lona', x: 10.6, y: 16.0, pilha: 'lona' },
  { id: 'martelo', x: 19.6, y: 8.6, pilha: 'caixa' },
  { id: 'isqueiro', x: 22.8, y: 13.8, pilha: 'casaco' },
  { id: 'arco', x: 13.0, y: 17.4, pilha: 'caixa' },
  { id: 'vara', x: 18.4, y: 17.0, pilha: 'pedacos' },
];
/* coisas dos destroços que viram material (as outras são ferramentas) */
const ACHADOS = {
  mala:    { nome: 'Mala', icone: '🧳', fichas: ['🧳', '=', '🥪', '🍎', '🧃'], ganha: { comida: 12 }, texto: 'Uma mala com lanches! +12 comida. Aperte E para comer quando tiver fome.' },
  mochila: { nome: 'Mochila', icone: '🎒', fichas: ['🎒', '=', '🍫', '🛍️'], ganha: { comida: 6, plastico: 2 }, texto: 'Uma mochila! +6 comida e +2 plástico.' },
  caixote: { nome: 'Caixote', icone: '📦', fichas: ['📦', '=', '🪵', '🪵', '🪵'], ganha: { madeira: 8 }, texto: 'Um caixote quebrado: +8 madeira!' },
  corda:   { nome: 'Corda', icone: '🪢', fichas: ['🪢', '=', '🌿', '🌿'], ganha: { cipo: 6 }, texto: 'Um rolo de corda! Vale como +6 cipó.' },
  lona:    { nome: 'Lona de plástico', icone: '🛍️', fichas: ['🛍️', '+', '🌿', '=', '🧥'], ganha: { plastico: 4 }, texto: 'Uma lona de plástico! +4 plástico. Plástico + cipó = capa de chuva (tecla R).' },
};
/* lagoa pertinho do avião, boa para pescar */
const LAGOA = { x: 21.6, y: 19.0, rx: 2.2, ry: 1.4 };
/* a ilha: uma forma meio redonda, com a costa ondulada */
const ILHA = { x: 20, y: 16.4, rx: 17.6, ry: 13.4 };
/* morros: o topo é plano e o paredão de pedra fica virado para baixo (sul) */
const MORROS = [
  { x: 29.0, y: 9.4, rx: 3.6, ry: 2.2 },
  { x: 10.4, y: 22.2, rx: 3.8, ry: 2.2 },
  { x: 26.8, y: 22.4, rx: 3.6, ry: 2.1 },
  { x: 35.2, y: 16.6, rx: 2.4, ry: 1.6 },
];
const ALTURA_MORRO = 0.95;
const CACHOEIRA = { x: 27.6, y: 0, rx: 1.05, ry: 0.5 };   // y calculado depois (embaixo do paredão)
const PLASTICOS = [[16.2, 9.6], [18.8, 14.2], [11.4, 8.4], [21.6, 7.4], [8.8, 15.6], [15.6, 17.0]];
/* roupas: feitas com as mãos, sem martelo (tecla R) */
const ROUPAS = {
  sandalia: { nome: 'Sandália de cipó', icone: '🩴', custo: { cipo: 3 }, desc: 'Anda mais rápido na mata.' },
  colete:   { nome: 'Colete de folhas', icone: '🦺', custo: { cipo: 5, ervas: 2 }, desc: 'Esquenta: o frio da noite dói bem menos.' },
  capa:     { nome: 'Capa de chuva', icone: '🧥', custo: { plastico: 4, cipo: 2 }, desc: 'A chuva não te machuca mais.' },
};

const NIVEIS_ABRIGO = [
  null,
  { nome: 'Abrigo de galhos', icone: '⛺', custo: { madeira: 10, cipo: 4 }, trabalho: 6, desc: 'Protege da chuva. Dá para dormir.' },
  { nome: 'Cabana de palha', icone: '🛖', custo: { madeira: 18, cipo: 8, pedra: 4 }, trabalho: 9, desc: 'Esquenta à noite e a onça não entra.' },
  { nome: 'Casa de madeira', icone: '🏠', custo: { madeira: 28, pedra: 10 }, trabalho: 12, desc: 'Bem forte: aguenta qualquer tempestade.' },
];
const CANOA_INFO = { nome: 'Canoa', icone: '🛶', custo: { madeira: 30, cipo: 10 }, trabalho: 10, desc: 'Faça em qualquer lugar e carregue até o rio.' };
const REMO_INFO = { nome: 'Remo', icone: 'remo', custo: { madeira: 6 }, desc: 'Sem remo a canoa não sai do lugar.' };

const BLOQUEIA = { arvore: 1, palmeira: 1, arbusto: 1, cipo: 1, pedra: 1 };
const QTD = { arvore: 8, palmeira: 6, arbusto: 4, cipo: 4, erva: 2, pedra: 5, plastico: 1, samambaia: 0, flor: 0, bananeira: 3 };
const REC_DE = { arbusto: 'comida', cipo: 'cipo', erva: 'ervas', pedra: 'pedra', carne: 'comida', plastico: 'plastico', bananeira: 'comida' };
const REBROTA = { arbusto: 1 / 30, cipo: 1 / 35, erva: 1 / 40, bananeira: 1 / 50 };
const TILES_DESTROCO = [[10, 11], [11, 11], [12, 11], [13, 11], [8, 10], [11, 13], [12, 13]];

/* ---------------- estado ---------------- */

let objetos, animais, fogueiras, flechas, particulas, flutuantes, mensagens, baloes, pedacosDestroco;
let recursos, bandeja, sel, jog, abrigo, canoa;
let tempo, clima, tempoClima, tempoRaio, clarao, raio;
let cena, tCena, fim, tFim, proximoEvento, horaAnt, pausado, menu, destrocoVisivel;
let tremor, camX = 0, camY = 0, anim = 0, jaDisse, chao, miniBase, tCapivara, confete, causaMorte;
let previsao, alvosRaio, tPrevia, roupas, tCalor, imaginacao, cobrasT;
let portalVila = { x: 44.5, y: 16.6, visivel: false };
let etapa2Concluida = false, etapa2Aberta = false, etapa2Carregada = false;
const bloq = new Uint8Array(ML * MA);
const teclas = { esq: false, dir: false, cima: false, baixo: false };

const formaIlha = a => 1 + 0.07 * Math.sin(3 * a + 1.3) + 0.05 * Math.sin(5 * a + 0.4) + 0.035 * Math.sin(8 * a + 2.1);
/* menor que 1 = dentro da ilha; 1 = na beira da água */
function distIlha(x, y) {
  const dx = (x - ILHA.x) / ILHA.rx, dy = (y - ILHA.y) / ILHA.ry;
  return Math.hypot(dx, dy) / formaIlha(Math.atan2(dy, dx));
}
const naIlha = (x, y) => distIlha(x, y) < 1;
const margemVila = y => 43.4 + 0.5 * Math.sin(y * 0.33 + 1);
const continente = (x, y) => x >= margemVila(y);
const ehRio = (x, y) => !naIlha(x, y) && !continente(x, y);      // o rio que rodeia a ilha
const ehLagoa = (x, y) => ((x - LAGOA.x) / LAGOA.rx) ** 2 + ((y - LAGOA.y) / LAGOA.ry) ** 2 < 1;
const ehPoca = (x, y) => ((x - CACHOEIRA.x) / CACHOEIRA.rx) ** 2 + ((y - CACHOEIRA.y) / CACHOEIRA.ry) ** 2 < 1;
const ehAgua = (x, y) => ehRio(x, y) || ehLagoa(x, y) || ehPoca(x, y);
const outraMargem = continente;
/* borda de baixo do topo do morro (onde começa o paredão) na coluna x */
function bordaMorro(m, x) {
  const k = (x - m.x) / m.rx;
  return Math.abs(k) >= 1 ? null : m.y + m.ry * Math.sqrt(1 - k * k);
}
CACHOEIRA.y = MORROS[0].y + MORROS[0].ry * Math.sqrt(1 - ((CACHOEIRA.x - MORROS[0].x) / MORROS[0].rx) ** 2) + ALTURA_MORRO + 0.4;
function noParedao(x, y) {
  for (const m of MORROS) { const b = bordaMorro(m, x); if (b !== null && y > b - 0.45 && y < b + ALTURA_MORRO) return m; }
  return null;
}
/* olhando para o leste: onde começa a água, se do outro lado dela estiver a vila */
function margemLeste(x, y) {
  for (let d = 0.5; d <= 3.2; d += 0.3) if (ehRio(x + d, y)) {
    for (let D = d; D < d + 18; D += 0.5) if (continente(x + D, y)) return x + d;
    return null;
  }
  return null;
}
function pontoNaIlha(margem = 0.8) {
  for (let i = 0; i < 60; i++) {
    const x = ILHA.x + (rnd() - 0.5) * ILHA.rx * 2, y = ILHA.y + (rnd() - 0.5) * ILHA.ry * 2;
    if (distIlha(x, y) < margem && livre(Math.floor(x), Math.floor(y))) return [x, y];
  }
  return [ILHA.x, ILHA.y];
}
const livre = (tx, ty) => tx >= 0 && ty >= 0 && tx < ML && ty < MA && !bloq[ty * ML + tx];

const hora = () => (HORA_INICIAL + tempo / DIA * 24) % 24;
const diaAtual = () => Math.floor((HORA_INICIAL + tempo / DIA * 24) / 24) + 1;
const ehNoite = () => { const h = hora(); return h >= 19 || h < 5.5; };
function escuridao() {
  const h = hora();
  if (h >= 7 && h < 17.5) return 0;
  if (h >= 17.5 && h < 19) return (h - 17.5) / 1.5;
  if (h >= 5.5 && h < 7) return 1 - (h - 5.5) / 1.5;
  return 1;
}
const fogoPerto = (x, y, r) => fogueiras.some(f => f.comb > 0 && dist(x, y, f.x, f.y) < r);

/* ---------------- criação do mundo ---------------- */

function novoJogo() {
  semente = (Date.now() % 1000000) | 1;
  objetos = []; animais = []; fogueiras = []; flechas = []; particulas = []; flutuantes = [];
  mensagens = []; baloes = []; confete = []; pedacosDestroco = [];
  recursos = { madeira: 0, pedra: 0, cipo: 0, ervas: 0, plastico: 0, comida: 0 };
  bandeja = ['maos']; sel = 0;
  jog = { x: INICIO.x, y: INICIO.y, dirX: 1, dirY: 0, olhandoEsq: false, andando: false, passo: 0, acao: null,
          vida: 85, fome: 70, energia: 80, tDano: 0, cooldown: 0, tTiro: 0, tPeixe: 0, tFaca: 0, caido: true, dormindo: false,
          carregando: false, doses: 0 };
  abrigo = null; canoa = null;
  tempo = 0; clima = 'sol'; tempoClima = 0; tempoRaio = 0; clarao = 0; raio = null;
  cena = 'ceu'; tCena = 0; fim = 0; tFim = 0; horaAnt = HORA_INICIAL;
  pausado = false; menu = null; destrocoVisivel = false; tremor = 0; jaDisse = {}; tCapivara = 30; causaMorte = '';
  portalVila.visivel = false; etapa2Concluida = false; etapa2Aberta = false; etapa2Frame.style.display = 'none';
  if (etapa2Carregada) { etapa2Frame.src = `etapa-2.html?run=${Date.now()}`; etapa2Carregada = false; }
  /* a primeira chuva só vem no dia 2, para dar tempo de se ambientar */
  proximoEvento = 360; previsao = null; alvosRaio = []; tPrevia = 0; roupas = []; tCalor = 0; imaginacao = null; cobrasT = 20;
  gerarMundo();
  atualizarBloqueios();
  for (let i = 0; i < 8; i++) { const [x, y] = pontoNaIlha(); if (dist(x, y, INICIO.x, INICIO.y) > 7) criarAnimal('capivara', x, y); }
  for (let i = 0; i < 12 && animais.filter(a => a.tipo === 'cobra').length < 4; i++) {
    const [x, y] = pontoNaIlha(0.85);
    if (dist(x, y, INICIO.x, INICIO.y) > 10) criarAnimal('cobra', x, y);
  }
  criarChao();
}

function criarObjeto(tipo, x, y) {
  const q = QTD[tipo] + (tipo === 'arvore' ? Math.floor(rnd() * 3) : 0);
  return { tipo, x, y, qtd: q, max: q, rebrota: 0, var: rnd(), ativo: true, tremor: 0, caindo: 0, ladoQueda: 1 };
}

function gerarMundo() {
  const ocup = new Uint8Array(ML * MA);
  for (const [x, y] of TILES_DESTROCO) ocup[y * ML + x] = 1;
  const cand = [];
  for (let ty = 0; ty < MA; ty++) for (let tx = 0; tx < ML; tx++) {
    const cx = tx + 0.5, cy = ty + 0.5;
    if (distIlha(cx, cy) > 0.92 || noParedao(cx, cy) || dist(cx, cy, CACHOEIRA.x, CACHOEIRA.y) < 2) continue;
    if (dist(cx, cy, 11.8, 11.6) < 3.4 || dist(cx, cy, INICIO.x, INICIO.y) < 2.6) continue;
    if (distSeg(cx, cy, ...SKID) < 1.3) continue;
    if (ESCONDIDOS.some(e => dist(cx, cy, e.x, e.y) < 1.4)) continue;
    if (PLASTICOS.some(([x, y]) => dist(cx, cy, x, y) < 1.0)) continue;
    if (((cx - LAGOA.x) / (LAGOA.rx + 1.3)) ** 2 + ((cy - LAGOA.y) / (LAGOA.ry + 1.3)) ** 2 < 1) continue;
    cand.push([tx, ty]);
  }
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  /* nada que bloqueia fica grudado do lado de outra coisa (no fim ainda conferimos se dá para chegar em tudo) */
  const isolado = (tx, ty) => {
    for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = tx + dx, y = ty + dy;
      if (x >= 0 && y >= 0 && x < ML && y < MA && ocup[y * ML + x]) return false;
    }
    return true;
  };
  const colocar = (tipoDe, n, aceita) => {
    let feitos = 0;
    for (const [tx, ty] of cand) {
      if (feitos >= n) break;
      if (ocup[ty * ML + tx]) continue;
      const tipo = typeof tipoDe === 'function' ? tipoDe(tx, ty) : tipoDe;
      if (!aceita(tx, ty)) continue;
      if (BLOQUEIA[tipo] && !isolado(tx, ty)) continue;
      ocup[ty * ML + tx] = 1;
      objetos.push(criarObjeto(tipo, tx + 0.5, ty + 0.5));
      feitos++;
    }
  };
  colocar('arbusto', 6, (tx, ty) => dist(tx, ty, INICIO.x, INICIO.y) < 9);
  colocar('pedra', 14, () => true);
  colocar('cipo', 16, () => true);
  colocar('arbusto', 11, () => true);
  colocar('bananeira', 9, () => true);
  colocar((tx, ty) => rnd() < (distIlha(tx + 0.5, ty + 0.5) > 0.74 ? 0.55 : 0.14) ? 'palmeira' : 'arvore', 140,
          (tx, ty) => rnd() < (distIlha(tx + 0.5, ty + 0.5) > 0.8 ? 0.5 : dist(tx, ty, 11.8, 11.6) < 7 ? 0.45 : 0.9));
  colocar('erva', 16, () => true);
  colocar('samambaia', 55, () => true);
  colocar('flor', 30, () => true);
  conectarIlha();
  /* pedaços de plástico do avião espalhados pela clareira */
  for (const [x, y] of PLASTICOS) objetos.push(criarObjeto('plastico', x, y));
  for (const e of ESCONDIDOS)
    objetos.push({ tipo: 'escondido', id: e.id, pilha: e.pilha, x: e.x, y: e.y, ativo: true,
                   revelado: e.id === 'mala', tRevelado: 1, var: rnd() });
  for (let i = 0; i < 16; i++) {
    const t = rnd(), x = lerp(SKID[0], SKID[2], t) + (rnd() - 0.5) * 1.6, y = lerp(SKID[1], SKID[3], t) + (rnd() - 0.5) * 1.2;
    pedacosDestroco.push({ x, y, r: rnd() * 6, s: 3 + rnd() * 5 });
  }
}

/* Garante que dá para andar até todo chão livre da ilha saindo do avião: tira o que estiver fechando caminho. */
function conectarIlha() {
  const N = ML * MA, bl = new Uint8Array(N), dono = new Map();
  for (let ty = 0; ty < MA; ty++) for (let tx = 0; tx < ML; tx++) {
    const cx = tx + 0.5, cy = ty + 0.5;
    if (!naIlha(cx, cy) || ehLagoa(cx, cy) || ehPoca(cx, cy) || noParedao(cx, cy)) bl[ty * ML + tx] = 1;
  }
  for (const [x, y] of TILES_DESTROCO) bl[y * ML + x] = 1;
  for (const o of objetos) if (BLOQUEIA[o.tipo]) { const i = Math.floor(o.y) * ML + Math.floor(o.x); bl[i] = 2; dono.set(i, o); }
  for (let volta = 0; volta < 200; volta++) {
    const vis = new Uint8Array(N), ini = Math.floor(INICIO.y) * ML + Math.floor(INICIO.x), fila = [ini];
    vis[ini] = 1;
    while (fila.length) {
      const i = fila.pop(), x = i % ML, y = (i - x) / ML;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, j = ny * ML + nx;
        if (nx < 0 || ny < 0 || nx >= ML || ny >= MA || vis[j] || bl[j]) continue;
        vis[j] = 1; fila.push(j);
      }
    }
    let preso = -1;
    for (let i = 0; i < N; i++) if (!bl[i] && !vis[i]) { preso = i; break; }
    if (preso < 0) return;
    const x = preso % ML, y = (preso - x) / ML;
    let tirou = false;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const j = (y + dy) * ML + x + dx;
      if (bl[j] === 2) { objetos.splice(objetos.indexOf(dono.get(j)), 1); bl[j] = 0; tirou = true; break; }
    }
    if (!tirou) bl[preso] = 1;
  }
}

function lugarLivrePerto(x, y) {
  for (let r = 0; r < 6; r++)
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const tx = Math.floor(x) + dx, ty = Math.floor(y) + dy;
      if (livre(tx, ty)) return { x: tx + 0.5, y: ty + 0.5 };
    }
  return null;
}

function criarAnimal(tipo, x, y) {
  const p = lugarLivrePerto(x, y);
  if (!p) return null;
  const a = { tipo, ativo: true, x: p.x, y: p.y, ax: p.x, ay: p.y, espera: rnd() * 3, fuga: 0, tAtaque: 1,
              vida: tipo === 'onca' ? 2 : 1, olhandoEsq: rnd() < 0.5, embora: false, tEmbora: 0, passo: 0,
              tDano: 0, movendo: false, var: rnd() };
  animais.push(a);
  return a;
}

function atualizarBloqueios() {
  bloq.fill(0);
  for (let ty = 0; ty < MA; ty++) for (let tx = 0; tx < ML; tx++) {
    const cx = tx + 0.5, cy = ty + 0.5;
    if (ehAgua(cx, cy) || outraMargem(cx, cy) || noParedao(cx, cy)) bloq[ty * ML + tx] = 1;
  }
  for (const o of objetos)
    if (o.ativo && BLOQUEIA[o.tipo] && (o.qtd > 0 || o.tipo === 'arbusto' || o.tipo === 'cipo'))
      bloq[Math.floor(o.y) * ML + Math.floor(o.x)] = 1;
  for (const [x, y] of TILES_DESTROCO) bloq[y * ML + x] = 1;
  if (abrigo) for (const [x, y] of abrigo.tiles) bloq[y * ML + x] = 1;
  for (const f of fogueiras) bloq[Math.floor(f.y) * ML + Math.floor(f.x)] = 1;
}

/* ---------------- mensagens e balões ---------------- */

function aviso(texto, tipo = 'info') {
  if (mensagens.length && mensagens[0].texto === texto) { mensagens[0].vida = 6; return; }
  mensagens.unshift({ texto, tipo, vida: 6 });
  if (mensagens.length > 3) mensagens.pop();
}

/* O balão de pensamento: figurinhas que aparecem uma a uma e depois somem. */
function pensar(fichas, texto, tipo = 'info', urgente = false) {
  const chave = fichas.join('');
  if (baloes.some(b => b.chave === chave)) return;
  const novo = { fichas, chave, t: 0, dur: 3.2 + fichas.length * 0.35 };
  /* um desenho que está passando não é cortado: o urgente entra logo depois dele */
  if (urgente) baloes.splice(baloes[0] && baloes[0].cena ? 1 : 0, 0, novo); else baloes.push(novo);
  if (baloes.length > 3) baloes.splice(baloes[0].cena ? 2 : 1, 1);
  if (texto) aviso(texto, tipo);
}

function dizerUmaVez(chave, intervalo, fichas, texto, tipo, urgente = false) {
  if (jaDisse[chave] !== undefined && tempo - jaDisse[chave] < intervalo) return;
  jaDisse[chave] = tempo;
  pensar(fichas, texto, tipo, urgente);
}

/* Balão de imaginação: um desenho animado mostrando como se faz cada coisa. */
function imaginar(cena, texto, fichas) {
  if (texto) aviso(texto, 'bom');
  if (!cena) { if (fichas) pensar(fichas, '', 'bom', true); return; }
  const chave = 'cena:' + cena;
  const ja = baloes.find(b => b.chave === chave);
  if (ja) { if (ja === baloes[0]) ja.t = Math.min(ja.t, 1); return; }
  baloes.unshift({ cena, fichas: fichas || [], chave, t: 0, dur: 7 });
  if (baloes.length > 3) baloes.splice(1, 1);
}

function flutuante(texto, x, y, cor = '#fff') { flutuantes.push({ texto, x, y, vida: 1.3, cor }); }

function particula(tipo, x, y, n, cor, forca = 1) {
  for (let i = 0; i < n; i++) {
    const p = { tipo, x: x * PX + (Math.random() - 0.5) * 8, y: y * PX + (Math.random() - 0.5) * 6, cor,
                vx: (Math.random() - 0.5) * 120 * forca, vy: -(40 + Math.random() * 110) * forca,
                vida: 0.6 + Math.random() * 0.4, max: 1, r: 2 + Math.random() * 2 };
    if (tipo === 'fumaca') { p.vx = (Math.random() - 0.3) * 14; p.vy = -18 - Math.random() * 14; p.vida = 2.5 + Math.random(); p.r = 5 + Math.random() * 4; }
    if (tipo === 'brilho') { p.vx *= 0.6; p.vy *= 0.6; p.vida = 0.8; }
    p.max = p.vida;
    particulas.push(p);
  }
  if (particulas.length > 400) particulas.splice(0, particulas.length - 400);
}

function machucar(qtd, texto, causa) {
  jog.vida -= qtd; jog.tDano = 0.5; efeito('dano'); tremor = Math.max(tremor, 0.25); causaMorte = causa || causaMorte;
  aviso(texto, 'perigo');
  if (jog.dormindo) acordar();
}

/* ---------------- jogador ---------------- */

function colide(x, y) {
  for (const [ox, oy] of [[-0.27, -0.18], [0.27, -0.18], [-0.27, 0.18], [0.27, 0.18]])
    if (!livre(Math.floor(x + ox), Math.floor(y + oy))) return true;
  return false;
}

function moverJogador(dt) {
  jog.andando = false;
  if (jog.acao && jog.acao.tipo === 'atravessar') return;
  let dx = (teclas.dir ? 1 : 0) - (teclas.esq ? 1 : 0);
  let dy = (teclas.baixo ? 1 : 0) - (teclas.cima ? 1 : 0);
  if (!dx && !dy) return;
  /* construção começada vai até o fim: o aldeão só sai quando terminar */
  if (construindo()) return dizerUmaVez('travado', 8, ['🔨', '⏳', '✔'], 'Espere a construção terminar! Falta pouco.');
  if (jog.dormindo) acordar();
  jog.acao = null;
  const n = Math.hypot(dx, dy); dx /= n; dy /= n;
  jog.dirX = dx; jog.dirY = dy;
  if (dx) jog.olhandoEsq = dx < 0;
  const v = VEL * (jog.energia < 8 ? 0.55 : 1) * (deMansinho() ? 0.5 : 1) * (roupas.includes('sandalia') ? 1.2 : 1) * (jog.carregando ? 0.8 : 1) * dt;
  const preso = colide(jog.x, jog.y);
  if (preso || !colide(jog.x + dx * v, jog.y)) jog.x += dx * v;
  if (preso || !colide(jog.x, jog.y + dy * v)) jog.y += dy * v;
  jog.x = clamp(jog.x, 0.3, ML - 0.3);
  jog.y = clamp(jog.y, 0.3, MA - 0.3);
  jog.andando = true;
  jog.passo += dt * (deMansinho() ? 0.6 : 1);
}

const ferramenta = () => bandeja[sel];
const tem = id => bandeja.includes(id);
const construindo = () => !!(jog.acao && jog.acao.tipo === 'construir');
const deMansinho = () => ferramenta() === 'faca' && !jog.acao;

/* O que está na frente do aldeão e dá para usar. */
function acharAlvo() {
  if (jog.dormindo) return null;
  if (jog.carregando) return alvoComCanoa();
  const fx = jog.x + jog.dirX * 0.7, fy = jog.y + jog.dirY * 0.7;
  let melhor = null, md = 99;
  const testar = (tipo, ref, x, y, alcance) => {
    const d = Math.min(dist(fx, fy, x, y), dist(jog.x, jog.y, x, y) + 0.2);
    if (d < alcance && d < md) { md = d; melhor = { tipo, ref, x, y }; }
  };
  for (const o of objetos) {
    if (!o.ativo || Math.abs(o.x - jog.x) > 2.5 || Math.abs(o.y - jog.y) > 2.5) continue;
    if (o.tipo === 'escondido') { if (o.revelado) testar('pegar', o, o.x, o.y, 1.3); continue; }
    if (o.qtd > 0) testar(o.tipo, o, o.x, o.y, BLOQUEIA[o.tipo] ? 1.35 : 1.05);
  }
  for (const f of fogueiras) testar('fogueira', f, f.x, f.y, 1.4);
  if (abrigo) testar('abrigo', abrigo, abrigo.x, abrigo.y + 1.0, 1.7);
  if (canoa) testar('canoa', canoa, canoa.x, canoa.y, 1.9);
  if (ferramenta() === 'faca') for (const a of animais)
    if (a.ativo && !a.embora) testar('presa', a, a.x, a.y, 1.5);
  if (!melhor) for (const d of [0.7, 1.1, 1.5]) {
    const x = jog.x + jog.dirX * d, y = jog.y + jog.dirY * d;
    if (ehAgua(x, y)) { melhor = { tipo: 'agua', x, y }; break; }
  }
  /* com a vara na mão, qualquer água encostada serve: não precisa mirar */
  if (!melhor && ferramenta() === 'vara') {
    let perto = 2.2;
    for (let i = 0; i < 16; i++) {
      const ang = i / 16 * Math.PI * 2;
      for (const d of [0.7, 1.2, 1.7, 2.2]) {
        const x = jog.x + Math.cos(ang) * d, y = jog.y + Math.sin(ang) * d;
        if (ehAgua(x, y)) { if (d < perto) { perto = d; melhor = { tipo: 'agua', x, y }; } break; }
      }
    }
  }
  if (portalVila.visivel) testar('portal', portalVila, portalVila.x, portalVila.y, 2.8);
  return melhor;
}

/* Carregando a canoa: perto do rio dá para colocar na água; perto da lagoa não leva a lugar nenhum; senão, larga no chão. */
function alvoComCanoa() {
  let rio = null, lagoa = false, perto = 2.6;
  for (let i = 0; i < 16; i++) {
    const ang = i / 16 * Math.PI * 2;
    for (const d of [0.6, 1.0, 1.5, 2.0, 2.6]) {
      const x = jog.x + Math.cos(ang) * d, y = jog.y + Math.sin(ang) * d;
      if (ehRio(x, y)) { if (d < perto) { perto = d; rio = { tipo: 'lancar', x, y }; } break; }
      if (ehLagoa(x, y)) { lagoa = true; break; }
    }
  }
  return rio || (lagoa ? { tipo: 'lagoa' } : { tipo: 'soltar' });
}

/* Troca sozinho para a ferramenta certa se o aldeão já tiver ela. */
function precisa(id) {
  if (tem(id)) { sel = bandeja.indexOf(id); return true; }
  const f = FERR[id];
  pensar([f.icone, '❓'], `Você precisa de ${f.artigo} ${f.nome.toLowerCase()}. Procure nos destroços do avião!`);
  return false;
}

function usar() {
  if (construindo()) return;
  const f = ferramenta();
  const alvo = acharAlvo();
  if (alvo && alvo.tipo === 'portal') return entrarNaEtapa2();
  if (jog.carregando) {
    if (alvo.tipo === 'lancar') return atravessar(alvo);
    if (alvo.tipo === 'lagoa') return pensar(['🌊', '🚫', '🏘️'], 'Essa lagoa não leva até a vila. Leve a canoa até o rio que fica em volta da ilha 🌊.');
    return soltarCanoa();
  }
  /* bicho perigoso por perto: o Enter já se defende com a melhor arma que tiver */
  const perigo = animais.filter(a => a.ativo && !a.embora && (a.tipo === 'onca' || (a.tipo === 'cobra' && a.brava)))
                        .sort((a, b) => dist(a.x, a.y, jog.x, jog.y) - dist(b.x, b.y, jog.x, jog.y))[0];
  if (perigo && f !== 'remedio') {
    const d = dist(perigo.x, perigo.y, jog.x, jog.y);
    if (d < 1.6 && tem('faca') && (f === 'faca' || !tem('arco') || d < 1.0)) { sel = bandeja.indexOf('faca'); return esfaquear(perigo); }
    if (d < 8 && tem('arco')) {
      sel = bandeja.indexOf('arco');
      jog.dirX = (perigo.x - jog.x) / (d || 1); jog.dirY = (perigo.y - 0.1 - jog.y) / (d || 1);
      return atirar();
    }
  }
  if (alvo && alvo.tipo === 'pegar') return pegarEscondido(alvo.ref);
  if (alvo && COLETAVEIS.includes(alvo.tipo)) return iniciarAcao('coletar', alvo.ref);
  if (f === 'remedio') return tomarRemedio();
  if (alvo && alvo.tipo === 'presa') return esfaquear(alvo.ref);
  /* martelo: sem nada na frente abre a construção; na frente da canoa ou do abrigo prontos, usa eles */
  if (f === 'martelo') {
    if (!alvo) return teclaConstruir();
    if ((alvo.tipo === 'abrigo' || alvo.tipo === 'canoa') && alvo.ref.emObra) return iniciarAcao('construir', alvo.ref);
  }
  if (f === 'arco') return atirar();
  if (f === 'isqueiro' && !(alvo && (alvo.tipo === 'abrigo' || alvo.tipo === 'canoa'))) return usarIsqueiro(alvo);
  if (!alvo) {
    if (f === 'vara') return imaginar('pescar', 'Para pescar: vá até a lagoa 💧 (pertinho do avião) ou a beira da água, encoste nela e aperte Enter.');
    if (f === 'machado') return imaginar('cortar', 'Para cortar: encoste numa árvore 🌳 e aperte Enter.');
    if (f === 'faca') return imaginar('faca', 'Ande de mansinho e chegue por TRÁS da capivara 🦫. Encostou? Aperte Enter!');
    return;
  }
  switch (alvo.tipo) {
    case 'arvore': case 'palmeira':
      if (precisa('machado')) iniciarAcao('cortar', alvo.ref);
      return;
    case 'agua':
      if (precisa('vara')) iniciarAcao('pescar', alvo);
      return;
    case 'fogueira':
      if (alvo.ref.comb > 0) return pensar(['🔥', '+', '🍖', '=', '😋'], 'Aperte E perto do fogo para comer comida assada.');
      if (precisa('isqueiro')) acenderFogueira(alvo.ref);
      return;
    case 'abrigo':
      if (alvo.ref.emObra) { if (precisa('martelo')) iniciarAcao('construir', alvo.ref); return; }
      return dormir();
    case 'canoa':
      if (alvo.ref.emObra) { if (precisa('martelo')) iniciarAcao('construir', alvo.ref); return; }
      return carregarCanoa();
  }
}

function entrarNaEtapa2() {
  if (!portalVila.visivel) return;
  menu = null; jog.acao = null; pausado = true; etapa2Aberta = true;
  if (!etapa2Carregada) { etapa2Frame.src = 'etapa-2.html'; etapa2Carregada = true; }
  etapa2Frame.style.display = 'block';
}

window.addEventListener('message', e => {
  if (e.source !== etapa2Frame.contentWindow || !e.data || e.data.type !== 'selva-stage2-return') return;
  etapa2Frame.style.display = 'none'; etapa2Aberta = false; pausado = false;
  window.focus(); tela.focus();
  jog.x = portalVila.x - 0.8; jog.y = portalVila.y; jog.dirX = 1; jog.dirY = 0; jog.acao = null;
  if (Number(e.data.fossils) >= 3) {
    etapa2Concluida = true; fim = 1; tFim = 0; efeito('vitoria');
  } else aviso('Você voltou à vila. O portal continua aberto; ainda faltam fósseis.', 'info');
});

const COLETAVEIS = ['arbusto', 'cipo', 'erva', 'pedra', 'carne', 'plastico', 'bananeira'];

function tomarRemedio() {
  if (jog.vida >= 95) return pensar(['❤️', '✔', '➜', '💊', '⏳'], 'Sua vida já está cheia! Guarde o remédio para quando se machucar.');
  jog.vida = Math.min(100, jog.vida + 40); jog.doses--;
  efeito('pegar'); particula('brilho', jog.x, jog.y - 0.8, 12, '#ff9a9a', 1);
  flutuante('💊 +40 ❤️', jog.x, jog.y - 1.7, '#ffb0b0');
  if (jog.doses <= 0) {
    bandeja.splice(bandeja.indexOf('remedio'), 1); sel = 0;
    aviso('Você tomou a última dose do remédio. Ainda dá para se curar perto da fogueira 🔥.', 'bom');
  } else aviso(`Você tomou o remédio! +40 de vida ❤️. Sobram ${jog.doses} dose${jog.doses > 1 ? 's' : ''}.`, 'bom');
}

function usarIsqueiro(alvo) {
  if (alvo && alvo.tipo === 'fogueira') {
    if (alvo.ref.comb > 0) return pensar(['🔥', '+', '🍖', '=', '😋'], 'O fogo já está aceso! Aperte E perto dele para comer comida assada.');
    return acenderFogueira(alvo.ref);
  }
  return fazerFogueira();
}

/* O que falta para chegar à vila, um passo de cada vez. */
function proximaMeta() {
  if (jog.carregando) return tem('remo') ? { id: 'atravessar', icone: '🌊', nome: 'Leve até o rio e aperte Enter!' }
                                         : { id: 'remo', icone: 'remo', nome: 'Remo', custo: REMO_INFO.custo };
  if (!tem('martelo')) return { id: 'martelo', icone: '🔨', nome: 'Ache o martelo nos destroços' };
  if (!abrigo) return { id: 'abrigo', icone: '⛺', nome: 'Abrigo de galhos', custo: NIVEIS_ABRIGO[1].custo };
  if (abrigo.emObra) return { id: 'obraAbrigo', icone: '🔨', nome: 'Construindo o abrigo...' };
  if (!canoa) return { id: 'canoa', icone: '🛶', nome: 'Canoa (em qualquer lugar)', custo: CANOA_INFO.custo };
  if (canoa.emObra) return { id: 'obraCanoa', icone: '🔨', nome: 'Construindo a canoa...' };
  if (!tem('remo')) return { id: 'remo', icone: 'remo', nome: 'Remo', custo: REMO_INFO.custo };
  if (!jog.carregando) return { id: 'levar', icone: '🛶', nome: 'Carregue a canoa (Enter nela)' };
  return { id: 'atravessar', icone: '🌊', nome: 'Leve até o rio e aperte Enter!' };
}

function avisarMetaPronta() {
  for (const id in ROUPAS)
    if (!roupas.includes(id) && podePagar(ROUPAS[id].custo))
      dizerUmaVez('roupa_' + id, 9999, [...Object.keys(ROUPAS[id].custo).map(r => ICONE_REC[r]), '=', ROUPAS[id].icone],
                  `Você já pode fazer: ${ROUPAS[id].nome}! ${ROUPAS[id].desc} Aperte R.`, 'bom');
  const m = proximaMeta();
  if (!m.custo || !podePagar(m.custo)) return;
  const fichas = [...Object.keys(m.custo).map(r => ICONE_REC[r]), '✔', '➜', m.icone];
  const onde = m.id === 'abrigo' ? ' Olhe para um lugar aberto e aperte C.' : ' Aperte C (pode ser em qualquer lugar).';
  dizerUmaVez('pronto_' + m.id, 9999, fichas, `Você já tem material para: ${m.nome.replace(' (em qualquer lugar)', '')}!${onde}`, 'bom', true);
}

/* Tecla F: fogueira (ou acender a que está apagada aqui perto). */
function teclaFogo() {
  if (construindo()) return;
  if (!tem('isqueiro')) return pensar(['isqueiro', '❓'], 'Para fazer fogo você precisa de um isqueiro. Procure nos destroços!');
  sel = bandeja.indexOf('isqueiro'); jog.acao = null;
  const perto = fogueiras.find(f => dist(jog.x, jog.y, f.x, f.y) < 1.8);
  usarIsqueiro(perto ? { tipo: 'fogueira', ref: perto } : null);
}

function iniciarAcao(tipo, alvo) {
  jog.acao = { tipo, alvo, t: 0 };
  if (alvo && alvo.x !== undefined && tipo !== 'pescar') jog.olhandoEsq = alvo.x < jog.x;
}

function pegarEscondido(o) {
  o.ativo = false; efeito('pegar');
  particula('brilho', o.x, o.y - 0.5, 14, '#ffe680', 1.2);
  const ach = ACHADOS[o.id];
  if (ach) {
    for (const r in ach.ganha) recursos[r] += ach.ganha[r];
    if (ach.vida) jog.vida = Math.min(100, jog.vida + ach.vida);
    flutuante(Object.entries(ach.ganha).map(([r, q]) => `+${q} ${ICONE_REC[r]}`).join('  '), o.x, o.y - 1.2, '#ffe680');
    pensar(ach.fichas, ach.texto, 'bom', true);
    return;
  }
  bandeja.push(o.id);
  sel = bandeja.length - 1;
  if (o.id === 'remedio') jog.doses = 2;
  const f = FERR[o.id];
  imaginar(f.cena, `Você achou ${f.artigo} ${f.nome.toLowerCase()}! ${f.dica}`, f.balao);
  if (bandeja.length === 2) setTimeout(() => aviso('Dica: Shift+Tab troca o que está na mão.'), 2500);
}

/* A flecha mira sozinha no bicho que está mais ou menos na frente. */
function atirar() {
  if (jog.cooldown > 0) return;
  jog.cooldown = 0.55; jog.tTiro = 0.3;
  let vx = jog.dirX, vy = jog.dirY, md = 9;
  for (const a of animais) {
    if (!a.ativo || a.embora) continue;
    const dx = a.x - jog.x, dy = a.y - 0.1 - jog.y, d = Math.hypot(dx, dy);
    if (d > 9 || d < 0.3) continue;
    if ((dx * jog.dirX + dy * jog.dirY) / d > 0.55 && d < md) { md = d; vx = dx / d; vy = dy / d; }
  }
  if (md < 9) jog.olhandoEsq = vx < 0;
  efeito('flecha');
  flechas.push({ x: jog.x + vx * 0.4, y: jog.y + vy * 0.4, vx: vx * 13, vy: vy * 13, vida: 0.75, presa: 0 });
}

function esfaquear(a) {
  if (jog.cooldown > 0) return;
  jog.cooldown = 0.5; jog.tFaca = 0.3; jog.olhandoEsq = a.x < jog.x; efeito('faca');
  if (a.tipo === 'capivara' && a.fuga > 0) return aviso('Ela te viu e fugiu! Chegue de mansinho, por trás. 🤫');
  acertar(a);
}

function acertar(a) {
  a.tDano = 0.4;
  if (a.tipo === 'capivara') {
    a.ativo = false;
    objetos.push({ tipo: 'carne', x: a.x, y: a.y, qtd: 3, max: 3, ativo: true, var: rnd(), tremor: 0 });
    flutuante('🎯', a.x, a.y - 1);
    dizerUmaVez('carne', 9999, ['🍖', '+', '✋', '='], 'Pegou! Pegue a carne com Enter. Assada no fogo ela alimenta mais.', 'bom');
  } else if (a.tipo === 'cobra') {
    a.ativo = false;
    flutuante('💥', a.x, a.y - 0.6);
    particula('folha', a.x, a.y - 0.2, 6, '#5a9a3a');
    aviso('Você espantou a cobra! 💪', 'bom');
  } else {
    a.vida--; a.fuga = 4;
    flutuante('💥', a.x, a.y - 1);
    if (a.vida <= 0) { a.embora = true; aviso('A onça fugiu para longe! 💪', 'bom'); }
    else aviso('Acertou a onça! Mais uma e ela foge!', 'bom');
  }
}

function fazerFogueira() {
  if (recursos.madeira < 3) return pensar(['🪵', '🪵', '🪵', '❓'], 'Para fazer fogo você precisa de 3 madeiras.');
  const lugar = lugarDaFogueira();
  if (!lugar) return aviso('Aqui não dá para fazer fogo. Procure um lugar mais limpo.');
  const [tx, ty] = lugar;
  recursos.madeira -= 3;
  fogueiras.push({ x: tx + 0.5, y: ty + 0.5, comb: 100 }); efeito('fogo');
  atualizarBloqueios();
  particula('faisca', tx + 0.5, ty + 0.4, 12, '#ffb040');
  dizerUmaVez('fogo', 9999, ['🔥', '=', '❤️', '🍖', '🥶', '🐆💨'],
              'Fogueira acesa! Fique pertinho dela: você recupera vida ❤️, não passa frio, a comida fica assada (E) e as onças fogem.', 'bom');
}

/* Na frente do aldeão; se tiver algo ali, tenta dos lados ou atrás. */
function lugarDaFogueira() {
  const px = Math.floor(jog.x), py = Math.floor(jog.y);
  const dirs = [[jog.dirX, jog.dirY], [-jog.dirY, jog.dirX], [jog.dirY, -jog.dirX], [-jog.dirX, -jog.dirY]];
  for (const [dx, dy] of dirs) for (const d of [1.0, 1.4]) {
    const tx = Math.floor(jog.x + dx * d), ty = Math.floor(jog.y + dy * d);
    if ((tx !== px || ty !== py) && livre(tx, ty)) return [tx, ty];
  }
  return null;
}

function acenderFogueira(f) {
  if (recursos.madeira < 3) return pensar(['🪵', '🪵', '🪵', '❓'], 'Precisa de 3 madeiras para acender o fogo.');
  recursos.madeira -= 3; f.comb = 100; efeito('fogo');
  particula('faisca', f.x, f.y - 0.1, 12, '#ffb040');
  aviso('🔥 O fogo voltou a queimar!', 'bom');
}

function comer() {
  if (construindo()) return;
  if (recursos.comida < 3) return pensar(['🍖', '❓'], 'Sem comida! Colha frutinhas 🍒, pesque 🎣 ou cace 🔪🏹.');
  recursos.comida -= 3; efeito('comer');
  if (fogoPerto(jog.x, jog.y, 3.2)) {
    jog.fome = Math.min(100, jog.fome + 35); jog.vida = Math.min(100, jog.vida + 8);
    flutuante('😋 Assado! +❤️', jog.x, jog.y - 1.6, '#ffd860');
  } else {
    jog.fome = Math.min(100, jog.fome + 20); flutuante('🍖 nham', jog.x, jog.y - 1.6);
    dizerUmaVez('assar', 120, ['🍖', '+', '🔥', '=', '😋', '❤️'], 'Dica: comendo perto da fogueira a comida fica assada e mata mais a fome.');
  }
}

function dormir() {
  if (!abrigo || abrigo.nivel < 1) return;
  jog.dormindo = true; jog.acao = null;
  jog.x = abrigo.x; jog.y = abrigo.y + 1.4;
  aviso('💤 Dormindo... (aperte uma seta para acordar)');
}
function acordar() { jog.dormindo = false; }

/* ---------------- construção (martelo) e roupas ---------------- */

function pertoDaMargem() { return margemLeste(jog.x, jog.y) !== null; }
const podePagar = c => Object.keys(c).every(r => recursos[r] >= c[r]);
const pagar = c => { for (const r in c) recursos[r] -= c[r]; };
const faltando = c => Object.keys(c).filter(r => recursos[r] < c[r]).map(r => `${c[r] - recursos[r]} ${NOME_REC[r]}`).join(', ');

/* Mato baixo não atrapalha: é limpo sozinho quando a casa começa. */
const MATO = { arbusto: 1, cipo: 1, erva: 1, plastico: 1, carne: 1, samambaia: 1, flor: 1, bananeira: 1 };
function oQueTemNoChao(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= ML || ty >= MA) return 'fora';
  if (ehAgua(tx + 0.5, ty + 0.5) || outraMargem(tx + 0.5, ty + 0.5)) return 'agua';
  if (TILES_DESTROCO.some(([x, y]) => x === tx && y === ty)) return 'aviao';
  if (fogueiras.some(f => Math.floor(f.x) === tx && Math.floor(f.y) === ty)) return 'fogueira';
  if (noParedao(tx + 0.5, ty + 0.5)) return 'morro';
  for (const o of objetos) {
    if (!o.ativo || MATO[o.tipo] || Math.floor(o.x) !== tx || Math.floor(o.y) !== ty) continue;
    if ((o.tipo === 'arvore' || o.tipo === 'palmeira') && o.qtd > 0) return 'arvore';
    if (o.tipo === 'pedra' && o.qtd > 0) return 'pedra';
    if (o.tipo === 'escondido') return 'escondido';
  }
  return null;
}

/* Onde a casa vai ficar: os 4 quadradinhos na frente do aldeão (ou um pouquinho para o lado). */
function lugarDoAbrigo() {
  const cx = jog.x + jog.dirX * 1.9, cy = jog.y + jog.dirY * 1.9 - (jog.dirY === 0 ? 0.5 : 0);
  const bx = Math.round(cx - 1), by = Math.round(cy - 1);
  const lados = Math.abs(jog.dirX) > Math.abs(jog.dirY) ? [[0, 0], [0, -1], [0, 1]] : [[0, 0], [-1, 0], [1, 0]];
  const corpo = [[-0.27, -0.18], [0.27, -0.18], [-0.27, 0.18], [0.27, 0.18]].map(([ox, oy]) => [Math.floor(jog.x + ox), Math.floor(jog.y + oy)]);
  let primeiro = null;
  for (const [ox, oy] of lados) {
    const tx0 = bx + ox, ty0 = by + oy;
    const tiles = [[tx0, ty0], [tx0 + 1, ty0], [tx0, ty0 + 1], [tx0 + 1, ty0 + 1]];
    const marcas = [];
    for (const [x, y] of tiles) {
      const q = corpo.some(([px, py]) => px === x && py === y) ? 'voce' : oQueTemNoChao(x, y);
      if (q) marcas.push([x, y, q]);
    }
    const lugar = { x: tx0 + 1, y: ty0 + 1, tiles, marcas, cabe: !marcas.length };
    if (lugar.cabe) return lugar;
    primeiro = primeiro || lugar;
  }
  return primeiro;
}

function limparMato(tiles) {
  let limpou = 0;
  for (const o of objetos)
    if (o.ativo && MATO[o.tipo] && tiles.some(([x, y]) => Math.floor(o.x) === x && Math.floor(o.y) === y)) {
      if (o.qtd > 0 && REC_DE[o.tipo]) recursos[REC_DE[o.tipo]] += o.qtd;
      o.ativo = false; limpou++;
      particula('folha', o.x, o.y - 0.3, 6, '#5aa040');
    }
  if (limpou) flutuante('🌿 mato limpo!', tiles[0][0] + 1, tiles[0][1], '#c8f0a0');
}

/* Tudo o que dá para construir agora com o martelo. */
function opcoesDeConstrucao() {
  const ops = [];
  if (tem('martelo')) {
    if (!abrigo) {
      const l = lugarDoAbrigo();
      ops.push({ id: 'abrigo', ...NIVEIS_ABRIGO[1], lugar: l, bloqueio: l.cabe ? '' : 'Não cabe aqui: abra espaço' });
    } else if (!abrigo.emObra && abrigo.nivel < 3) {
      ops.push({ id: 'melhorar', ...NIVEIS_ABRIGO[abrigo.nivel + 1],
                 bloqueio: dist(jog.x, jog.y, abrigo.x, abrigo.y + 1) > 3.5 ? 'Chegue perto do abrigo' : '' });
    }
    if (!canoa) { const l = lugarDaCanoa(); ops.push({ id: 'canoa', ...CANOA_INFO, lugar: l, bloqueio: l ? '' : 'Não cabe aqui' }); }
    if (canoa && !tem('remo')) ops.push({ id: 'remo', ...REMO_INFO });
  }
  /* com a canoa nas costas só dá para fazer o remo */
  return jog.carregando ? ops.filter(o => o.id === 'remo') : ops;
}

/* Tecla R: roupas feitas à mão. */
function teclaRoupas() {
  if (construindo()) return;
  if (menu) { menu = null; return; }
  const ops = Object.keys(ROUPAS).filter(id => !roupas.includes(id)).map(id => ({ id, roupa: true, ...ROUPAS[id] }));
  if (!ops.length) return aviso('Você já fez todas as roupas! 😎', 'bom');
  jog.acao = null;
  menu = { ops, sel: Math.max(0, ops.findIndex(o => podePagar(o.custo))), titulo: '🧵  Que roupa você quer fazer?' };
}

/* Tecla C: se só uma coisa dá para fazer, faz direto; se tiver mais de uma, abre o menu. */
function teclaConstruir() {
  if (construindo()) return;
  if (menu) { menu = null; return; }
  const ops = opcoesDeConstrucao();
  if (!ops.length) return jog.carregando ? aviso('Leve a canoa até o rio 🌊 e aperte Enter.') : tem('martelo') ? aviso('Você já construiu tudo! Carregue a canoa até o rio. 🛶')
                                         : pensar(['🔨', '❓'], 'Para construir você precisa de um martelo. Procure nos destroços!');
  jog.acao = null;
  const possiveis = ops.filter(o => !o.bloqueio && podePagar(o.custo));
  const meta = proximaMeta();
  if (possiveis.length === 1) return construirOpcao(possiveis[0]);
  if (possiveis.length > 1) {
    menu = { ops, sel: ops.indexOf(possiveis.find(o => o.id === meta.id) || possiveis[0]) };
    return;
  }
  /* nada dá para fazer agora: explica o que falta para o próximo passo */
  const op = ops.find(o => o.id === meta.id) || ops[0];
  if (!podePagar(op.custo)) {
    const falta = Object.keys(op.custo).filter(r => recursos[r] < op.custo[r]);
    return pensar([op.icone, '➜', ...falta.map(r => ICONE_REC[r]), '❓'], `${op.nome}: ainda faltam ${faltando(op.custo)}.`, 'info', true);
  }
  explicarBloqueio(op);
}

function explicarBloqueio(op) {
  menu = null;
  if (op.id === 'abrigo') {
    tPrevia = 8;
    const arv = op.lugar.marcas.filter(m => m[2] === 'arvore').length;
    return imaginar('limpar', arv ? `Não cabe aqui! Corte ${arv > 1 ? `as ${arv} árvores marcadas` : 'a árvore marcada'} com o machado 🪓 para abrir espaço, ou procure um lugar aberto.`
                                  : 'Não cabe aqui! Olhe para um lugar aberto (sem árvore, pedra ou água) e aperte C de novo.');
  }
  if (op.id === 'canoa') return pensar(['🛶', '❓', '➜', '🌳', '🚫'], 'A canoa não cabe aqui. Vá para um lugar mais aberto e aperte C de novo.', 'info', true);
  aviso(`🚫 ${op.bloqueio}.`);
}

function confirmarMenu() {
  const op = menu.ops[menu.sel];
  if (op.bloqueio) return explicarBloqueio(op);
  if (!podePagar(op.custo)) return pensar([...Object.keys(op.custo).filter(r => recursos[r] < op.custo[r]).map(r => ICONE_REC[r]), '❓'], `Faltam: ${faltando(op.custo)}.`);
  construirOpcao(op);
}

function construirOpcao(op) {
  menu = null;
  pagar(op.custo);
  if (op.roupa) {
    roupas.push(op.id); efeito('pronto');
    particula('brilho', jog.x, jog.y - 0.8, 16, '#ffe680', 1.2);
    return pensar([...Object.keys(op.custo).map(r => ICONE_REC[r]), '=', op.icone], `Você fez: ${op.nome}! ${op.desc}`, 'bom', true);
  }
  if (op.id === 'remo') {
    bandeja.push('remo');
    return pensar(FERR.remo.balao, 'Você fez um remo! ' + FERR.remo.dica, 'bom');
  }
  sel = bandeja.indexOf('martelo');
  if (op.id === 'abrigo') {
    limparMato(op.lugar.tiles);
    abrigo = { x: op.lugar.x, y: op.lugar.y, tiles: op.lugar.tiles, nivel: 0, alvoNivel: 1, emObra: true, prog: 0, trabalho: op.trabalho };
    atualizarBloqueios();
  } else if (op.id === 'melhorar') {
    Object.assign(abrigo, { alvoNivel: abrigo.nivel + 1, emObra: true, prog: 0, trabalho: op.trabalho });
  } else if (op.id === 'canoa') {
    canoa = { x: op.lugar.x, y: op.lugar.y, emObra: true, pronta: false, prog: 0, trabalho: op.trabalho, ang: 0 };
    jog.olhandoEsq = canoa.x < jog.x;
  }
  tPrevia = 0;
  iniciarAcao('construir', op.id === 'canoa' ? canoa : abrigo);
  jog.acao.nome = op.nome;
  aviso(`🔨 Construindo: ${op.nome}... espere terminar!`);
}

function concluirObra(ob) {
  jog.acao = null; ob.emObra = false; ob.prog = 0; efeito('pronto');
  particula('brilho', ob.x, ob.y, 18, '#ffe680', 1.4);
  if (ob === abrigo) {
    abrigo.nivel = abrigo.alvoNivel;
    const n = NIVEIS_ABRIGO[abrigo.nivel];
    pensar([n.icone, '=', '😴', '🌧️'], `${n.nome} pronto! Aperte Enter perto dele para dormir.`, 'bom');
  } else {
    canoa.pronta = true;
    pensar(['🛶', '⬆', '➜', '🌊', '➜', '🏘️'], tem('remo') ? 'A canoa está pronta! Aperte Enter perto dela para carregar e leve até o rio 🌊.'
                                                          : 'A canoa está pronta! Faça um remo (tecla C) e depois carregue a canoa até o rio 🌊.', 'bom');
  }
}

/* A canoa ocupa uns 3 quadradinhos deitados: na frente, dos lados ou atrás do aldeão. */
function lugarDaCanoa() {
  const dirs = [[jog.dirX, jog.dirY], [-jog.dirY, jog.dirX], [jog.dirY, -jog.dirX], [-jog.dirX, -jog.dirY]];
  const pty = Math.floor(jog.y), ptx = Math.floor(jog.x);
  for (const [dx, dy] of dirs) for (const d of [1.3, 2.0]) {
    const tx = Math.floor(jog.x + dx * d * (Math.abs(dx) > 0.5 ? 1.6 : 1)), ty = Math.floor(jog.y + dy * d);
    const ok = [-1, 0, 1].every(o => livre(tx + o, ty) && !ehAgua(tx + o + 0.5, ty + 0.5) && !(ty === pty && tx + o === ptx));
    if (ok) return { x: tx + 0.5, y: ty + 0.5 };
  }
  return null;
}

function carregarCanoa() {
  if (!canoa || !canoa.pronta) return;
  jog.carregando = true; jog.acao = null;
  dizerUmaVez('carregar', 9999, ['🛶', '⬆', '➜', '🌊'],
              tem('remo') ? 'Você levantou a canoa! Leve até a beira do rio 🌊 (em volta da ilha) e aperte Enter.'
                          : 'Você levantou a canoa! Falta o remo: aperte C para fazer. Depois leve até o rio 🌊.', 'bom', true);
}

function soltarCanoa() {
  const l = lugarDaCanoa();
  if (!l) return aviso('Aqui não dá para largar a canoa. Procure um lugar mais aberto.');
  jog.carregando = false;
  canoa.x = l.x; canoa.y = l.y; canoa.ang = 0;
}

/* Caminho da canoa: sai da beira, contorna a ilha pela água e chega no píer da vila. */
function caminhoAteVila(x0, y0) {
  const anel = a => { const f = formaIlha(a) * 1.13; return [ILHA.x + Math.cos(a) * ILHA.rx * f, ILHA.y + Math.sin(a) * ILHA.ry * f]; };
  const a0 = Math.atan2((y0 - ILHA.y) / ILHA.ry, (x0 - ILHA.x) / ILHA.rx);
  let delta = -a0;
  while (delta > Math.PI) delta -= Math.PI * 2;
  while (delta < -Math.PI) delta += Math.PI * 2;
  const pts = [[x0, y0]], n = Math.max(1, Math.ceil(Math.abs(delta) / 0.1));
  for (let i = 0; i <= n; i++) pts.push(anel(a0 + delta * i / n));
  pts.push([margemVila(ILHA.y) - 1.9, ILHA.y + 0.7]);
  return pts;
}

function atravessar(alvo) {
  if (!canoa || !canoa.pronta) return;
  if (!tem('remo')) return pensar(['remo', '❓'], 'Falta o remo! Aperte C para fazer um (6 madeiras).');
  if (clima === 'tempestade') return pensar(['⛈️', '🚫', '🛶'], 'Com essa tempestade é perigoso! Espere passar.');
  jog.carregando = false;
  const caminho = caminhoAteVila(alvo.x, alvo.y);
  canoa.x = caminho[0][0]; canoa.y = caminho[0][1];
  jog.acao = { tipo: 'atravessar', t: 0, caminho, d: 0 };
  efeito('agua');
}

/* ---------------- simulação ---------------- */

function atualizar(dt) {
  if (cena !== 'jogo') return atualizarIntro(dt);
  if (fim) { tFim += dt; return; }
  tempo += dt;
  const h = hora();
  if (horaAnt < 6 && h >= 6) amanhecer();
  if (horaAnt < 16.5 && h >= 16.5 && (!abrigo || !fogueiras.length))
    pensar(['🌙', '➜', '⛺', '🔥'], 'Vai escurecer! Faça um abrigo (tecla C) e uma fogueira (tecla F).');
  if (horaAnt < 19 && h >= 19) anoitecer();
  horaAnt = h;

  moverJogador(dt);
  atualizarAcao(dt);
  jog.cooldown = Math.max(0, jog.cooldown - dt);
  jog.tDano = Math.max(0, jog.tDano - dt);
  jog.tTiro = Math.max(0, jog.tTiro - dt);
  jog.tPeixe = Math.max(0, jog.tPeixe - dt);
  jog.tFaca = Math.max(0, jog.tFaca - dt);
  tPrevia = Math.max(0, tPrevia - dt);
  atualizarFlechas(dt);
  for (const a of animais) if (a.ativo) (a.tipo === 'onca' ? atualizarOnca : a.tipo === 'cobra' ? atualizarCobra : atualizarCapivara)(a, dt);
  cobrasT -= dt;
  if (cobrasT <= 0) {
    cobrasT = 50;
    if (animais.filter(a => a.ativo && a.tipo === 'cobra').length < 3 + Math.min(3, diaAtual())) {
      const [x, y] = pontoNaIlha(0.85);
      if (dist(x, y, jog.x, jog.y) > 12) criarAnimal('cobra', x, y);
    }
  }
  atualizarFogueiras(dt);
  for (const o of objetos) {
    const t = REBROTA[o.tipo];
    if (!t || !o.ativo || o.qtd >= o.max) continue;
    o.rebrota += dt * t;
    if (o.rebrota >= 1) { o.rebrota -= 1; o.qtd++; }
  }
  atualizarClima(dt);
  maeNatureza(dt);
  avisarMetaPronta();
  atualizarStatus(dt);
  for (const o of objetos)
    if (o.tipo === 'escondido' && o.ativo && !o.revelado && dist(jog.x, jog.y, o.x, o.y) < 5.5) {
      o.revelado = true; o.tRevelado = 0;
      particula('brilho', o.x, o.y - 0.4, 12, '#ffe680');
      flutuante('✨ achei algo!', o.x, o.y - 1.2, '#ffe680');
    }
  if (jog.x > 30 && distIlha(jog.x, jog.y) > 0.75 && !jaDisse.rio) {
    jaDisse.rio = 1;
    pensar(['🌊', '➜', '🛶', '➜', '🏘️'], 'Do outro lado da água tem uma vila! Construa uma canoa (tecla C) e carregue até o rio.');
  }
  tCapivara -= dt;
  if (tCapivara <= 0) {
    tCapivara = 35;
    animais = animais.filter(a => a.ativo);
    if (animais.filter(a => a.tipo === 'capivara').length < 6) {
      const [x, y] = pontoNaIlha();
      if (dist(x, y, jog.x, jog.y) > 12) criarAnimal('capivara', x, y);
    }
  }
  if (jog.vida <= 0) { jog.vida = 0; fim = 2; tFim = 0; jog.acao = null; jog.dormindo = false; }
}

function atualizarAcao(dt) {
  const a = jog.acao;
  if (!a) return;
  const antes = a.t;
  a.t += dt;
  const golpe = Math.floor(a.t / GOLPE) > Math.floor(antes / GOLPE);
  switch (a.tipo) {
    case 'cortar': {
      const o = a.alvo;
      if (o.qtd <= 0) { jog.acao = null; break; }
      if (golpe) {
        o.qtd--; recursos.madeira++; o.tremor = 1; efeito('machado');
        particula('lasca', o.x - (jog.x < o.x ? 0.2 : -0.2), o.y - 0.3, 5, '#e2bb84');
        flutuante('+1 🪵', o.x, o.y - 1.9);
        if (o.qtd <= 0) {
          o.caindo = 0.001; o.ladoQueda = jog.x < o.x ? 1 : -1;
          atualizarBloqueios(); jog.acao = null;
          dizerUmaVez('arvore', 9999, ['🪵', '+', '🌿', '+', '🔨', '=', '⛺'], 'Junte madeira e cipó 🌿 para construir um abrigo com o martelo (tecla C)!');
        }
      }
      break;
    }
    case 'coletar': {
      const o = a.alvo;
      if (!o.ativo || o.qtd <= 0) { jog.acao = null; break; }
      if (golpe) {
        o.qtd--; efeito('coletar');
        const r = REC_DE[o.tipo], n = o.tipo === 'carne' || o.tipo === 'bananeira' ? 2 : 1;
        recursos[r] += n;
        flutuante(`+${n} ${ICONE_REC[r]}`, o.x, o.y - 1.0);
        particula(o.tipo === 'pedra' ? 'lasca' : 'folha', o.x, o.y - 0.3, 4, o.tipo === 'pedra' ? '#b8b4ac' : '#5aa040');
        if (o.qtd <= 0) {
          if (o.tipo === 'carne' || o.tipo === 'pedra') { o.ativo = false; atualizarBloqueios(); }
          jog.acao = null;
        }
      }
      break;
    }
    case 'pescar':
      jog.olhandoEsq = a.alvo.x < jog.x;
      if (a.peixe === undefined) a.peixe = 1.6 + rnd() * 1.2;
      if (a.t >= a.peixe) {
        a.peixe = a.t + 2 + rnd() * 2;
        recursos.comida += 3; jog.tPeixe = 0.9; efeito('agua');
        flutuante('+3 🐟', a.alvo.x, a.alvo.y - 0.8);
        particula('agua', a.alvo.x, a.alvo.y, 8, '#cfe8ff');
        dizerUmaVez('peixe', 9999, ['🐟', '+', '🔥', '=', '😋'], 'Pegou um peixe! Continue parado que vem mais. Assado no fogo (E perto da fogueira) ele alimenta mais.', 'bom');
      }
      break;
    case 'construir': {
      const ob = a.alvo;
      if (!ob.emObra) { jog.acao = null; break; }
      if (golpe) { ob.prog += 0.55; efeito('martelo'); particula('lasca', ob.x + (ob === canoa ? -0.4 : 0), ob.y + (ob === canoa ? 0 : 0.4), 4, '#d9b07a'); }
      if (ob.prog >= ob.trabalho) concluirObra(ob);
      break;
    }
    case 'atravessar': {
      if (!a.chegou) {
        let resto = dt * 4.6;
        while (resto > 0 && a.caminho.length > 1) {
          const [x0, y0] = a.caminho[0], [x1, y1] = a.caminho[1], seg = Math.hypot(x1 - x0, y1 - y0);
          if (seg <= resto) { resto -= seg; a.caminho.shift(); continue; }
          a.caminho[0] = [x0 + (x1 - x0) / seg * resto, y0 + (y1 - y0) / seg * resto];
          canoa.ang = Math.atan2(y1 - y0, x1 - x0);
          resto = 0;
        }
        [canoa.x, canoa.y] = a.caminho[0];
        jog.x = canoa.x; jog.y = canoa.y; jog.olhandoEsq = Math.cos(canoa.ang) < 0;
        if (a.caminho.length <= 1) { a.chegou = true; a.tc = 0; canoa.ang = 0; }
      } else {
        a.tc += dt;
        jog.x = canoa.x + 0.6 + Math.min(2.4, a.tc * 1.8); jog.y = ILHA.y + 0.2; jog.olhandoEsq = false;
        if (a.tc > 1.6 && !portalVila.visivel) {
          portalVila.visivel = true; jog.x = portalVila.x - 0.8; jog.y = portalVila.y;
          jog.dirX = 1; jog.dirY = 0; jog.acao = null; efeito('pronto');
          pensar(['🛶', '➜', '🏘️', '➜', '🌀'], 'Você chegou à vila! Um portal misterioso apareceu. Aproxime-se e aperte E para explorar outro mundo.', 'bom', true);
        }
      }
      break;
    }
  }
}

function atualizarFlechas(dt) {
  for (const f of flechas) {
    if (f.presa > 0) { f.presa -= dt; continue; }
    f.vida -= dt; f.x += f.vx * dt; f.y += f.vy * dt;
    for (const a of animais)
      if (a.ativo && !a.embora && dist(f.x, f.y, a.x, a.y - 0.1) < 0.6) { acertar(a); f.vida = 0; break; }
    if (f.vida > 0 && !ehAgua(f.x, f.y) && !livre(Math.floor(f.x), Math.floor(f.y))) { f.presa = 1.5; f.vida = 0; }
  }
  flechas = flechas.filter(f => f.vida > 0 || f.presa > 0);
}

function moverBicho(a, dx, dy, passo) {
  if (dx < -0.01) a.olhandoEsq = true; else if (dx > 0.01) a.olhandoEsq = false;
  const pode = (x, y) => (a.embora && (x < 0 || y < 0 || x >= ML || y >= MA)) || (livre(Math.floor(x), Math.floor(y)));
  a.passo += passo; a.movendo = true;
  /* se algo está no caminho, desvia girando para um lado e mantém o desvio por
     um pedacinho de caminho, para contornar a árvore em vez de ficar tremendo */
  if (a.tDesvio > 0) { a.tDesvio -= passo; if (a.tDesvio <= 0) a.desvio = 0; }
  const desvios = a.desvio ? [a.desvio, a.desvio * 1.5, 0] : [0, 0.6, -0.6, 1.2, -1.2, 1.8, -1.8];
  for (const ang of desvios) {
    const c = Math.cos(ang), s = Math.sin(ang);
    const nx = a.x + (dx * c - dy * s) * passo, ny = a.y + (dx * s + dy * c) * passo;
    if (pode(nx, ny)) {
      a.x = nx; a.y = ny;
      if (ang && !a.desvio) { a.desvio = ang; a.tDesvio = 1.2; }
      return true;
    }
  }
  a.desvio = 0;
  return false;
}

function atualizarCapivara(a, dt) {
  a.movendo = false;
  const d = dist(a.x, a.y, jog.x, jog.y);
  if (a.fuga > 0) {
    a.fuga -= dt;
    const n = d || 1;
    moverBicho(a, (a.x - jog.x) / n, (a.y - jog.y) / n, 3.4 * dt);
    return;
  }
  a.tViu = Math.max(0, (a.tViu || 0) - dt);
  const naFrente = a.olhandoEsq ? jog.x < a.x + 0.2 : jog.x > a.x - 0.2;
  const viu = deMansinho() ? naFrente && d < 3.2 && Math.abs(jog.y - a.y) < 1.8 : d < 2.6 && jog.andando;
  if (viu) {
    a.fuga = 1.6; a.tViu = 1.2;
    if (ferramenta() === 'faca') dizerUmaVez('viu', 25, ['🦫', '👀', '❗', '➜', '🔙'], 'A capivara te viu! Chegue por TRÁS dela, de mansinho.');
    return;
  }
  if (a.espera > 0) { a.espera -= dt; return; }
  const dx = a.ax - a.x, dy = a.ay - a.y, n = Math.hypot(dx, dy);
  if (n < 0.1) {
    a.espera = 2 + rnd() * 5;
    for (let i = 0; i < 8; i++) {
      const x = a.x + (rnd() - 0.5) * 6, y = a.y + (rnd() - 0.5) * 6;
      if (x > 0.5 && y > 0.5 && y < MA - 0.5 && livre(Math.floor(x), Math.floor(y))) { a.ax = x; a.ay = y; break; }
    }
    return;
  }
  if (!moverBicho(a, dx / n, dy / n, Math.min(n, 0.7 * dt))) { a.ax = a.x; a.ay = a.y; }
}

/* A cobra fica na mata. Quando você chega perto ela levanta a cabeça e chia (dá tempo de fugir) e depois dá o bote. */
function atualizarCobra(a, dt) {
  a.movendo = false;
  a.tDano = Math.max(0, a.tDano - dt);
  a.tMorde = Math.max(0, (a.tMorde || 0) - dt);
  const d = dist(a.x, a.y, jog.x, jog.y), n = d || 1;
  if (a.fuga > 0) { a.fuga -= dt; moverBicho(a, (a.x - jog.x) / n, (a.y - jog.y) / n, 1.6 * dt); return; }
  if (fogoPerto(a.x, a.y, 3)) { a.fuga = 2; return; }
  if (d < 3.2 && !jog.dormindo && !construindo()) {
    if (!a.brava) {
      a.brava = true; a.tAviso = 1.0; efeito('cobra');
      if (!jaDisse.cobraCena) {
        jaDisse.cobraCena = 1;
        imaginar('cobra', 'Cuidado, uma cobra! 🐍 Quando ela levanta a cabeça, vai dar o bote. Afaste-se, ou aperte Enter: a flecha 🏹 ou a faca 🔪 espantam ela.');
      } else dizerUmaVez('cobra', 30, ['🐍', '❗', '➜', '🏃'], 'Cobra! Afaste-se ou aperte Enter para atacar.', 'perigo', true);
    }
    a.tAviso -= dt;
    a.olhandoEsq = jog.x < a.x;
    if (a.tAviso > 0) return;
    if (d > 0.75) { moverBicho(a, (jog.x - a.x) / n, (jog.y - a.y) / n, Math.min(d - 0.7, 1.7 * dt)); return; }
    if (a.tMorde <= 0) { a.tMorde = 1.6; machucar(10, '🐍 A cobra te mordeu! Afaste-se dela!', 'cobra'); a.fuga = 1.3; }
    return;
  }
  a.brava = false;
  if (a.espera > 0) { a.espera -= dt; return; }
  const dx = a.ax - a.x, dy = a.ay - a.y, m = Math.hypot(dx, dy);
  if (m < 0.1) {
    a.espera = 2 + rnd() * 5;
    for (let i = 0; i < 8; i++) {
      const x = a.x + (rnd() - 0.5) * 5, y = a.y + (rnd() - 0.5) * 5;
      if (distIlha(x, y) < 0.88 && livre(Math.floor(x), Math.floor(y)) && dist(x, y, INICIO.x, INICIO.y) > 6) { a.ax = x; a.ay = y; break; }
    }
    return;
  }
  if (!moverBicho(a, dx / m, dy / m, Math.min(m, 0.6 * dt))) { a.ax = a.x; a.ay = a.y; }
}

function atualizarOnca(a, dt) {
  a.movendo = false;
  a.tDano = Math.max(0, a.tDano - dt);
  if (!ehNoite()) a.embora = true;
  if (a.embora) {
    a.tEmbora += dt;
    const lado = a.x < ML / 2 ? -1 : 1;
    moverBicho(a, lado, 0, 2.6 * dt) || moverBicho(a, lado * 0.6, 0.8, 2.6 * dt);
    if (a.tEmbora > 7 || a.x < -1 || a.x > ML + 1) a.ativo = false;
    return;
  }
  const d = dist(a.x, a.y, jog.x, jog.y);
  for (const f of fogueiras)
    if (f.comb > 0 && dist(a.x, a.y, f.x, f.y) < 4.5) {
      a.fuga = Math.max(a.fuga, 2.5);
      dizerUmaVez('fogoOnca', 40, ['🔥', '=', '🐆💨'], 'O fogo espantou a onça!', 'bom');
    }
  if (a.fuga > 0) {
    a.fuga -= dt;
    const n = d || 1;
    moverBicho(a, (a.x - jog.x) / n, (a.y - jog.y) / n, 2.4 * dt);
    return;
  }
  if (construindo() && d < 10) {
    a.fuga = Math.max(a.fuga, 2.5);
    dizerUmaVez('marteloOnca', 40, ['🔨', '🔊', '🐆💨'], 'O barulho do martelo espantou a onça!', 'bom');
  }
  if (d < 9) {
    const como = tem('arco') ? 'Aperte Enter para atirar flechas 🏹: com 2 flechadas ela foge! Bem de pertinho a faca 🔪 também machuca ela.'
               : tem('faca') ? 'Quando ela chegar perto, aperte Enter para atacar com a faca 🔪 (2 golpes e ela foge). O fogo 🔥 também espanta!'
               : 'Corra para perto do fogo 🔥! O arco 🏹 e a faca 🔪 dos destroços também servem para espantar a onça.';
    if (!jaDisse.oncaCena) { jaDisse.oncaCena = 1; imaginar('onca', 'Uma onça! 🐆 ' + como); }
    else dizerUmaVez('onca', 35, ['🐆', '❗', '➜', tem('arco') ? '🏹' : tem('faca') ? '🔪' : '🔥'], 'Onça! ' + como, 'perigo', true);
  }
  const protegido = jog.dormindo && abrigo && abrigo.nivel >= 2;
  if (protegido || d > 14) return;
  if (d > 0.85) { moverBicho(a, (jog.x - a.x) / d, (jog.y - a.y) / d, Math.min(d - 0.8, 3.5 * dt)); a.tAtaque = Math.min(a.tAtaque, 0.5); return; }
  a.tAtaque -= dt;
  if (a.tAtaque <= 0) {
    a.tAtaque = 1.5;
    machucar(15, '🐆 A onça te atacou! Corra para o fogo ou atire com o arco!', 'onca');
  }
}

function atualizarFogueiras(dt) {
  for (const f of fogueiras) {
    if (f.comb <= 0) continue;
    f.comb -= dt * (100 / 110) * (clima === 'chuva' ? 2 : 1);
    if (clima === 'tempestade') f.comb = 0;
    if (f.comb <= 0) { f.comb = 0; dizerUmaVez('apagou', 30, ['🔥', '➜', '💨'], 'A fogueira apagou. Use o isqueiro e 3 madeiras para acender de novo.'); }
  }
}

function abrigado() {
  if (!abrigo || abrigo.nivel < 1) return false;
  return jog.dormindo || dist(jog.x, jog.y, abrigo.x, abrigo.y + 1.2) < 1.4;
}

function atualizarStatus(dt) {
  jog.fome = Math.max(0, jog.fome - dt * (jog.dormindo ? 0.12 : 0.27));
  const trabalhando = jog.acao && jog.acao.tipo !== 'atravessar';
  if (jog.dormindo) jog.energia = Math.min(100, jog.energia + dt * [0, 1.3, 1.7, 2.2][abrigo.nivel]);
  else jog.energia = Math.max(0, jog.energia - dt * (trabalhando ? 0.18 : jog.andando ? 0.1 : 0.03));
  if (jog.dormindo && jog.energia >= 100) { acordar(); aviso('☀️ Você acordou descansado!', 'bom'); }

  let perda = 0, exposto = false;
  const coberto = abrigado(), calor = fogoPerto(jog.x, jog.y, 3.2), obra = construindo();
  if (jog.fome <= 0) { perda += 0.5; causaMorte = 'fome'; dizerUmaVez('fome0', 25, ['😫', '🍖', '❗'], 'Você está morrendo de fome! Aperte E para comer.', 'perigo'); }
  else if (jog.fome < 30) dizerUmaVez('fome', 45, ['🍖', '❓'], 'Você está com fome. Aperte E para comer.');
  if (jog.energia <= 0) { perda += 0.25; causaMorte = 'cansaco'; }
  else if (jog.energia < 20) dizerUmaVez('sono', 50, ['😴', '➜', '⛺'], abrigo && abrigo.nivel >= 1
    ? 'Você está cansado. Durma no abrigo (Enter perto dele).' : 'Você está cansado. Construa um abrigo para dormir (tecla C).');
  if (clima !== 'sol' && !coberto && !obra) {
    const capa = roupas.includes('capa');
    if (!capa || clima === 'tempestade') {
      perda += clima === 'tempestade' ? (capa ? 0.15 : 0.35) : 0.12; exposto = true; causaMorte = 'chuva';
      dizerUmaVez('chuva', 30, ['🌧️', '➜', '⛺'], abrigo && abrigo.nivel >= 1 ? 'Você está tomando chuva! Corra para o abrigo ⛺.' : 'Você está tomando chuva! Construa um abrigo ⛺ ou faça uma capa de chuva 🧥.', 'perigo');
    } else dizerUmaVez('capaOk', 9999, ['🧥', '+', '🌧️', '=', '😊'], 'Com a capa de chuva você não se molha!', 'bom');
  }
  if (ehNoite() && !calor && !(coberto && abrigo && abrigo.nivel >= 2) && !obra) {
    perda += roupas.includes('colete') ? 0.05 : 0.14; exposto = true; causaMorte = causaMorte || 'frio';
    dizerUmaVez('frio', 40, ['🥶', '➜', '🔥'], 'Está frio! Fique perto de uma fogueira acesa (tecla F).');
  }
  jog.vida -= perda * dt;
  if (jog.vida < 40 && tem('remedio'))
    dizerUmaVez('lembraRemedio', 45, ['🤕', '➜', '💊', '=', '❤️'], 'Sua vida está baixa! Tome o remédio: Shift+Tab até o 💊 e aperte Enter.', 'perigo', true);
  /* pertinho do fogo o corpo esquenta e recupera */
  if (calor && jog.fome > 15 && perda === 0) {
    jog.vida = Math.min(100, jog.vida + dt * 0.7);
    jog.energia = Math.min(100, jog.energia + dt * 0.12);
    tCalor -= dt;
    if (tCalor <= 0) { tCalor = 2.2; if (jog.vida < 100) flutuante('❤️ +', jog.x + 0.3, jog.y - 1.7, '#ff9a9a'); }
    dizerUmaVez('calor', 9999, ['🔥', '=', '❤️', '⬆'], 'Pertinho do fogo você se esquenta e recupera vida! ❤️', 'bom');
  } else if (!exposto && perda === 0 && jog.fome > 40 && jog.energia > 20)
    jog.vida = Math.min(100, jog.vida + dt * (jog.dormindo ? 0.4 : 0.12));
}

/* ---------------- a mãe natureza ---------------- */

function amanhecer() {
  aviso(`🌅 Amanheceu! Dia ${diaAtual()}.`, 'bom');
  for (const a of animais) if (a.tipo === 'onca') a.embora = true;
}

function anoitecer() {
  const d = diaAtual();
  aviso('🌙 Anoiteceu. Cuidado com o frio e com as onças!');
  if (rnd() < Math.min(0.55 + (d - 1) * 0.2, 1)) soltarOnca();
  if (d >= 3 && rnd() < 0.4) soltarOnca();
}

function soltarOnca() {
  for (let i = 0; i < 12; i++) {
    const ang = rnd() * Math.PI * 2, x = jog.x + Math.cos(ang) * 11, y = jog.y + Math.sin(ang) * 11;
    if (x < 1 || y < 1 || x > ML - 1 || y > MA - 1 || ehAgua(x, y) || outraMargem(x, y) || fogoPerto(x, y, 6)) continue;
    if (criarAnimal('onca', x, y)) return;
  }
}

/* A chuva nunca chega de surpresa: as nuvens avisam um minuto antes. */
const AVISO_CHUVA = 60;
function maeNatureza(dt) {
  proximoEvento -= dt;
  const d = diaAtual();
  if (!previsao && clima === 'sol' && proximoEvento <= AVISO_CHUVA) {
    const tipo = jaDisse.primeiraChuva && rnd() < 0.5 + d * 0.08 ? 'tempestade' : 'chuva';
    previsao = { tipo };
    pensar(['💨', '➜', tipo === 'tempestade' ? '⛈️' : '🌧️', '➜', '⛺'],
           tipo === 'tempestade' ? 'Ouviu o vento? 💨 Vento forte é sinal de TEMPESTADE com raios! Daqui a pouco ela chega: corra para o abrigo ⛺.'
                                 : 'Ouviu o vento? 💨 Vento forte é sinal de chuva! Daqui a pouco vai chover: fique perto do abrigo ⛺.', 'perigo', true);
  }
  if (proximoEvento > 0) return;
  proximoEvento = Math.max(75, 165 - (d - 1) * 25) * (0.75 + rnd() * 0.5);
  if (clima !== 'sol' || !previsao) { previsao = null; return; }
  const tipo = previsao.tipo;
  previsao = null; jaDisse.primeiraChuva = 1;
  if (tipo === 'tempestade') {
    clima = 'tempestade'; tempoClima = 30 + rnd() * 25; tempoRaio = 4; trovao(0.8);
    pensar(['⛈️', '➜', '⛺'], 'Tempestade! O vento apaga o fogo e caem raios. Corra para o abrigo!', 'perigo', true);
  } else {
    clima = 'chuva'; tempoClima = 35 + rnd() * 30;
    pensar(['🌧️', '➜', '⛺'], 'Começou a chover! Fique embaixo do abrigo ⛺ ou use a capa de chuva 🧥.');
  }
}

function atualizarClima(dt) {
  if (clima !== 'sol') {
    tempoClima -= dt;
    if (tempoClima <= 0) { aviso(clima === 'tempestade' ? '🌤️ A tempestade passou.' : '🌤️ A chuva parou.', 'bom'); clima = 'sol'; }
  }
  if (clima === 'tempestade') {
    tempoRaio -= dt;
    if (tempoRaio <= 0) { tempoRaio = 4 + rnd() * 5; marcarRaio(); }
  }
  for (const r of alvosRaio) { r.t -= dt; if (r.t <= 0) cairRaio(r); }
  alvosRaio = alvosRaio.filter(r => r.t > 0);
}

/* O raio avisa antes: um círculo amarelo pisca no chão onde ele vai cair. */
function marcarRaio() {
  let alvo;
  if (rnd() < 0.5 && !abrigado() && !construindo()) alvo = { x: jog.x, y: jog.y };
  else {
    const arv = objetos.filter(o => o.ativo && (o.tipo === 'arvore' || o.tipo === 'palmeira') && o.qtd > 0 &&
                                    Math.abs(o.x - jog.x) < 12 && Math.abs(o.y - jog.y) < 8);
    if (!arv.length) return;
    const o = arv[Math.floor(rnd() * arv.length)];
    alvo = { x: o.x, y: o.y, arvore: o };
  }
  alvosRaio.push({ ...alvo, t: 1.9, dur: 1.9 });
  if (dist(alvo.x, alvo.y, jog.x, jog.y) < 4)
    dizerUmaVez('raioAviso', 9999, ['⚡', '⭕', '➜', '🏃'], 'Viu o círculo amarelo piscando no chão? Um raio vai cair ali! Saia de perto correndo.', 'perigo', true);
}

function cairRaio(r) {
  const o = r.arvore;
  if (o && o.ativo && o.qtd > 0) { o.qtd = 0; o.caindo = 0.001; o.ladoQueda = rnd() < 0.5 ? 1 : -1; atualizarBloqueios(); }
  raio = { x: r.x, y: r.y, t: 0.35, seed: Math.random() * 1000 };
  trovao(Math.min(1.2, dist(r.x, r.y, jog.x, jog.y) * 0.06));
  clarao = 1; tremor = Math.max(tremor, 0.3);
  particula('faisca', r.x, r.y, 14, '#fff2a0', 1.5);
  if (dist(r.x, r.y, jog.x, jog.y) < 1.3 && !abrigado()) machucar(20, '⚡ O raio caiu pertinho de você! Fuja do círculo amarelo!', 'raio');
}

/* ---------------- intro ---------------- */

function atualizarIntro(dt) {
  tCena += dt;
  if (cena === 'ceu' && tCena > 6.6) { cena = 'queda'; tCena = 0; }
  else if (cena === 'queda') {
    if (tCena > 1.9 && !destrocoVisivel) {
      destrocoVisivel = true; tremor = 1;
      particula('poeira', 12.5, 11.4, 30, '#a08060', 2.2);
      particula('fumaca', 12.5, 11.2, 14, '#666');
      particula('faisca', 12.8, 11.3, 20, '#ffb040', 1.6);
    }
    if (tCena > 3.8) { cena = 'acorda'; tCena = 0; }
  } else if (cena === 'acorda') {
    if (tCena > 2.4) jog.caido = false;
    if (tCena > 3.6) comecarJogo();
  }
}

function comecarJogo() {
  cena = 'jogo'; jog.caido = false; destrocoVisivel = true;
  pensar(['❓', '✈️', '🔍'], 'Você sobreviveu! Use as SETAS para andar e explore os destroços do avião.');
}

/* ---------------- câmera ---------------- */

const BORDA_CAM = 150;
function atualizarCamera(dt, instantaneo) {
  let ax = jog.x, ay = jog.y - 0.5;
  if (cena === 'ceu' || cena === 'queda') { ax = 17.5; ay = 10; }
  const tx = clamp(ax * PX - W / 2, -BORDA_CAM, ML * PX - W + BORDA_CAM), ty = clamp(ay * PX - H / 2, -BORDA_CAM, MA * PX - H + BORDA_CAM);
  const k = instantaneo ? 1 : 1 - Math.exp(-dt * 5);
  camX += (tx - camX) * k; camY += (ty - camY) * k;
}

/* ---------------- efeitos visuais (tempo real) ---------------- */

/* borboletas de dia, vaga-lumes à noite, bandos de pássaros e folhas caindo */
const ceu = { borboletas: [], vagalumes: [], passaros: [], folhas: [], tPassaro: 6 };
function atualizarVidaSelvagem(dt) {
  if (cena !== 'jogo') return;
  const cx = (camX + W / 2) / PX, cy = (camY + H / 2) / PX;
  const dia = escuridao() < 0.3 && clima === 'sol', noite = escuridao() > 0.45 && clima !== 'tempestade';
  const perto = b => dist(b.x, b.y, cx, cy) < 20;
  ceu.borboletas = ceu.borboletas.filter(b => perto(b) && (dia || Math.random() > dt * 0.8));
  if (dia && ceu.borboletas.length < 7 && Math.random() < dt * 1.5) {
    const x = cx + (Math.random() - 0.5) * 24, y = cy + (Math.random() - 0.5) * 15;
    if (naIlha(x, y)) ceu.borboletas.push({ x, y, vx: 0, vy: 0, f: Math.random() * 6, alt: 0.9 + Math.random() * 0.8,
                                            cor: ['#ffd23a', '#ff8ac8', '#7ad0ff', '#ffffff', '#ff9a3a'][Math.floor(Math.random() * 5)] });
  }
  for (const b of ceu.borboletas) {
    b.f += dt; b.vx = clamp(b.vx + (Math.random() - 0.5) * dt * 5, -1.1, 1.1); b.vy = clamp(b.vy + (Math.random() - 0.5) * dt * 5, -0.7, 0.7);
    b.x += b.vx * dt; b.y += b.vy * dt; b.alt = clamp(b.alt + Math.sin(b.f * 2) * dt * 0.4, 0.5, 2);
  }
  ceu.vagalumes = ceu.vagalumes.filter(v => perto(v) && (noite || Math.random() > dt));
  if (noite && ceu.vagalumes.length < 30 && Math.random() < dt * 8) {
    const x = cx + (Math.random() - 0.5) * 26, y = cy + (Math.random() - 0.5) * 16;
    if (naIlha(x, y)) ceu.vagalumes.push({ x, y, f: Math.random() * 6, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4 });
  }
  for (const v of ceu.vagalumes) { v.f += dt; v.x += (v.vx + Math.sin(v.f * 0.9) * 0.2) * dt; v.y += (v.vy + Math.cos(v.f * 0.7) * 0.15) * dt; }
  ceu.tPassaro -= dt;
  if (ceu.tPassaro <= 0 && escuridao() < 0.5 && clima !== 'tempestade') {
    ceu.tPassaro = 16 + Math.random() * 22;
    const lado = Math.random() < 0.5 ? 1 : -1, y0 = cy - 6 + Math.random() * 12, n = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) ceu.passaros.push({ x: cx - lado * (17 + i * 0.7), y: y0 + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 0.55, vx: lado * 4.5, f: Math.random() * 6 });
  }
  for (const p of ceu.passaros) { p.x += p.vx * dt; p.f += dt; }
  ceu.passaros = ceu.passaros.filter(p => Math.abs(p.x - cx) < 24);
  if (Math.random() < dt * (0.6 + forcaVento() * 5)) {
    const arv = objetos.filter(o => o.ativo && o.tipo === 'arvore' && o.qtd > 0 && Math.abs(o.x - cx) < 13 && Math.abs(o.y - cy) < 8);
    if (arv.length) {
      const o = arv[Math.floor(Math.random() * arv.length)];
      ceu.folhas.push({ x: o.x + (Math.random() - 0.5) * 1.4, y: o.y, alt: 1.3 + Math.random() * 0.6, vx: forcaVento() * 2 * (Math.random() < 0.8 ? 1 : -1),
                        f: Math.random() * 6, cor: ['#4a9a3c', '#c8a040', '#d87a30', '#6aaa40'][Math.floor(Math.random() * 4)] });
    }
  }
  for (const f of ceu.folhas) { f.f += dt; f.alt -= dt * (0.35 + forcaVento() * 0.3); f.x += (f.vx + Math.sin(f.f * 3) * 0.6) * dt; }
  ceu.folhas = ceu.folhas.filter(f => f.alt > 0);
}

function desenharVidaSelvagem() {
  for (const f of ceu.folhas) {
    const x = f.x * PX, y = (f.y - f.alt) * PX;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(f.f * 3) * 1.2);
    elip(0, 0, 4, 2, f.cor); lin(-4, 0, 4, 0, 'rgba(0,0,0,0.25)', 0.6);
    ctx.restore();
  }
  for (const b of ceu.borboletas) {
    const x = b.x * PX, y = (b.y - b.alt) * PX, asa = Math.abs(Math.sin(b.f * 14));
    elip(b.x * PX, b.y * PX + 4, 3, 1.2, 'rgba(15,35,10,0.18)');
    elip(x - 3 * asa, y, 3.5 * asa + 0.6, 2.8, b.cor); elip(x + 3 * asa, y, 3.5 * asa + 0.6, 2.8, b.cor);
    lin(x, y - 2.5, x, y + 2.5, '#2a1a10', 1.2);
  }
  for (const p of ceu.passaros) {
    const x = p.x * PX, y = (p.y - 5) * PX, asa = Math.sin(p.f * 9) * 5;
    elip(p.x * PX + 30, p.y * PX + 10, 5, 2, 'rgba(15,35,10,0.15)');
    ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 8, y - asa); ctx.quadraticCurveTo(x - 3, y - 3, x, y); ctx.quadraticCurveTo(x + 3, y - 3, x + 8, y - asa); ctx.stroke();
  }
}

function atualizarVisual(dt) {
  anim += dt;
  if (!pausado) { atualizarVidaSelvagem(dt); atualizarNuvens(dt); }
  tremor = Math.max(0, tremor - dt * 1.5);
  clarao = Math.max(0, clarao - dt * 2.5);
  if (raio) { raio.t -= dt; if (raio.t <= 0) raio = null; }
  for (const p of particulas) {
    p.vida -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.tipo === 'fumaca') { p.r += dt * 6; p.vx += dt * 4; }
    else if (p.tipo !== 'brilho') p.vy += 300 * dt;
  }
  particulas = particulas.filter(p => p.vida > 0);
  for (const f of flutuantes) { f.vida -= dt; f.y -= dt * 0.6; }
  flutuantes = flutuantes.filter(f => f.vida > 0);
  for (const m of mensagens) m.vida -= dt;
  mensagens = mensagens.filter(m => m.vida > 0);
  if (baloes.length) { baloes[0].t += dt; if (baloes[0].t > baloes[0].dur) baloes.shift(); }
  for (const o of objetos) {
    if (o.tremor > 0) o.tremor = Math.max(0, o.tremor - dt * 3);
    if (o.caindo) {
      o.caindo += dt * 1.7;
      if (o.caindo >= 1) { o.caindo = 0; particula('poeira', o.x + o.ladoQueda * 1.2, o.y, 10, '#8a7050', 1.2); tremor = Math.max(tremor, 0.12); }
    }
    if (o.tipo === 'escondido' && o.revelado) o.tRevelado += dt;
  }
  if (cena === 'jogo' && !pausado) {
    for (const f of fogueiras) if (f.comb > 0) {
      if (Math.random() < dt * 5) particula('faisca', f.x, f.y - 0.3, 1, '#ffc050', 0.5);
      if (Math.random() < dt * 2.5) particula('fumaca', f.x, f.y - 0.6, 1, '#888');
    }
    for (const [x, y] of CASAS_VILA)
      if (Math.random() < dt * 1.2 && x * PX > camX - 40 && x * PX < camX + W + 40) particula('fumaca', x + 0.52, y - 1.85, 1, '#999');
    if (destrocoVisivel && tempo < DIA * 1.5 && Math.random() < dt * 2 * (1 - tempo / (DIA * 1.5)))
      particula('fumaca', 13.4, 11.2, 1, '#555');
  }
  if (cena === 'queda' && destrocoVisivel && Math.random() < dt * 8) particula('fumaca', 12.8 + Math.random(), 11.2, 1, '#555');
  if (fim === 1) {
    if (confete.length < 120 && Math.random() < 0.6)
      confete.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 80,
                     r: Math.random() * 6, cor: ['#ff5a5a', '#ffd23a', '#4ad07a', '#4aa8ff', '#c06aff'][Math.floor(Math.random() * 5)] });
    for (const c of confete) { c.x += c.vx * dt; c.y += c.vy * dt; c.r += dt * 4; }
    confete = confete.filter(c => c.y < H + 20);
  }
}

/* ======================================================================
   DESENHO
   ====================================================================== */

/* ---- chão (desenhado uma vez só) ---- */
function caminhoIlha(g, esc = 1) {
  g.beginPath();
  for (let i = 0; i <= 200; i++) {
    const a = i / 200 * Math.PI * 2, r = formaIlha(a) * esc;
    const x = (ILHA.x + Math.cos(a) * ILHA.rx * r) * PX, y = (ILHA.y + Math.sin(a) * ILHA.ry * r) * PX;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function caminhoContinente(g, desl) {
  g.beginPath();
  for (let y = -1; y <= MA + 1; y += 0.25) g.lineTo((margemVila(y) + desl) * PX, y * PX);
  g.lineTo((ML + 1) * PX, (MA + 1) * PX); g.lineTo((ML + 1) * PX, -PX);
  g.closePath();
}
/* pontos da beira da ilha (para a espuma das ondinhas) */
const COSTA = [];
for (let i = 0; i < 240; i++) {
  const a = i / 240 * Math.PI * 2, r = formaIlha(a);
  const nx = Math.cos(a) / ILHA.rx, ny = Math.sin(a) / ILHA.ry, n = Math.hypot(nx, ny);
  COSTA.push([ILHA.x + Math.cos(a) * ILHA.rx * r, ILHA.y + Math.sin(a) * ILHA.ry * r, nx / n, ny / n]);
}

function trilha(g, pts, larg) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
