  for (const [w, cor] of [[larg + 8, 'rgba(120,96,56,0.16)'], [larg, 'rgba(160,126,78,0.32)'], [larg * 0.45, 'rgba(190,156,104,0.22)']]) {
    g.strokeStyle = cor; g.lineWidth = w; g.beginPath();
    pts.forEach(([x, y], i) => {
      if (!i) return g.moveTo(x * PX, y * PX);
      const [px, py] = pts[i - 1];
      g.quadraticCurveTo(px * PX + (y - py) * 8, py * PX - (x - px) * 8, x * PX, y * PX);
    });
    g.stroke();
  }
  g.restore();
}

function desenharMorro(g, m) {
  const cx = m.x * PX, cy = m.y * PX, rx = m.rx * PX, ry = m.ry * PX, h = ALTURA_MORRO * PX;
  g.fillStyle = 'rgba(20,40,10,0.3)'; g.beginPath(); g.ellipse(cx + 12, cy + h + 10, rx * 1.03, ry, 0, 0, 7); g.fill();
  /* corpo de pedra: a elipse de cima "esticada" para baixo */
  g.save();
  g.beginPath(); g.ellipse(cx, cy + h, rx, ry, 0, 0, Math.PI); g.lineTo(cx - rx, cy); g.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, false); g.closePath();
  const gp = g.createLinearGradient(0, cy, 0, cy + ry + h);
  gp.addColorStop(0, '#a49880'); gp.addColorStop(0.55, '#857a66'); gp.addColorStop(1, '#5e5546');
  g.fillStyle = gp; g.fill(); g.clip();
  const r = () => Math.random();
  for (let i = 0; i < 14; i++) {      // camadas da rocha
    const y = cy + ry * 0.2 + i * (h / 6), k = 0.85 + r() * 0.15;
    g.strokeStyle = `rgba(60,52,40,${0.25 + r() * 0.2})`; g.lineWidth = 1.2;
    g.beginPath(); g.ellipse(cx, y, rx * k, ry * k, 0, 0.15, Math.PI - 0.15); g.stroke();
  }
  for (let i = 0; i < 26; i++) {      // rachaduras e pedrinhas
    const a = 0.2 + r() * (Math.PI - 0.4), x = cx + Math.cos(a) * rx * 0.96, y = cy + Math.sin(a) * ry * 0.96 + r() * h;
    g.strokeStyle = 'rgba(50,44,34,0.5)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 6, y + 6 + r() * 10); g.stroke();
    g.fillStyle = `rgba(200,190,170,${0.2 + r() * 0.25})`; g.beginPath(); g.ellipse(x + 4, y + 3, 3 + r() * 3, 2, 0, 0, 7); g.fill();
  }
  g.restore();
  /* topo de grama */
  const gt = g.createRadialGradient(cx - rx * 0.3, cy - ry * 0.4, 6, cx, cy, rx);
  gt.addColorStop(0, '#9cc862'); gt.addColorStop(1, '#78a84a');
  g.fillStyle = gt; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(210,240,160,0.55)'; g.lineWidth = 2; g.beginPath(); g.ellipse(cx, cy, rx - 2, ry - 2, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
  g.strokeStyle = 'rgba(70,96,40,0.6)'; g.lineWidth = 2.5; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0.05, Math.PI - 0.05); g.stroke();
  for (let i = 0; i < 18; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r()) * 0.85, x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d;
    g.strokeStyle = 'rgba(60,110,40,0.8)'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 5); g.moveTo(x, y); g.lineTo(x + 2, y - 5); g.stroke();
  }

}

function criarChao() {
  const c = document.createElement('canvas');
  c.width = ML * PX * ESC_CHAO; c.height = MA * PX * ESC_CHAO;
  const g = c.getContext('2d');
  g.scale(ESC_CHAO, ESC_CHAO);
  const LW = ML * PX, LH = MA * PX, IX = ILHA.x * PX, IY = ILHA.y * PX;
  const r = () => Math.random();
  /* água funda */
  let gr = g.createRadialGradient(IX, IY, ILHA.rx * PX * 0.8, IX, IY, ML * PX * 0.75);
  gr.addColorStop(0, '#2a78a8'); gr.addColorStop(1, '#174d78');
  g.fillStyle = gr; g.fillRect(0, 0, LW, LH);
  for (let i = 0; i < 220; i++) {
    g.fillStyle = r() < 0.5 ? 'rgba(70,150,200,0.14)' : 'rgba(10,40,80,0.14)';
    g.beginPath(); g.ellipse(r() * LW, r() * LH, 30 + r() * 70, 8 + r() * 18, 0, 0, 7); g.fill();
  }
  /* o continente com a vila */
  g.fillStyle = 'rgba(120,200,210,0.45)'; caminhoContinente(g, -0.7); g.fill();
  g.fillStyle = '#d9c48c'; caminhoContinente(g, -0.05); g.fill();
  g.fillStyle = '#e8d6a2'; caminhoContinente(g, 0.15); g.fill();
  gr = g.createLinearGradient(LW - 5 * PX, 0, LW, 0); gr.addColorStop(0, '#6fa046'); gr.addColorStop(1, '#5e9440');
  g.fillStyle = gr; caminhoContinente(g, 0.9); g.fill();
  /* água rasinha em volta da ilha */
  for (const [esc, cor] of [[1.16, 'rgba(60,150,190,0.3)'], [1.1, 'rgba(70,170,200,0.4)'], [1.05, 'rgba(96,196,206,0.55)'], [1.02, 'rgba(130,214,212,0.6)']]) {
    g.fillStyle = cor; caminhoIlha(g, esc); g.fill();
  }
  /* praia */
  g.fillStyle = '#c8ae74'; caminhoIlha(g, 1.0); g.fill();
  g.fillStyle = '#e6d29c'; caminhoIlha(g, 0.988); g.fill();
  g.save(); caminhoIlha(g, 0.988); g.clip();
  for (let i = 0; i < 500; i++) { g.fillStyle = r() < 0.5 ? 'rgba(255,250,230,0.35)' : 'rgba(170,140,90,0.25)'; g.fillRect(r() * LW, r() * LH, 2, 2); }
  g.restore();
  /* grama */
  g.save(); caminhoIlha(g, 0.935); g.clip();
  gr = g.createRadialGradient(IX - 80, IY - 60, 40, IX, IY, ILHA.rx * PX);
  gr.addColorStop(0, '#80b04e'); gr.addColorStop(1, '#5e9340');
  g.fillStyle = gr; g.fillRect(0, 0, LW, LH);
  for (let i = 0; i < 900; i++) {
    const x = r() * LW, y = r() * LH, raio = 12 + r() * 44, t = r();
    g.fillStyle = t < 0.4 ? 'rgba(190,230,120,0.10)' : t < 0.75 ? 'rgba(30,80,25,0.11)' : 'rgba(140,120,60,0.07)';
    g.beginPath(); g.ellipse(x, y, raio, raio * 0.6, r() * 3, 0, 7); g.fill();
  }
  /* trilhas de terra */
  trilha(g, [[13.2, 12.8], [16.5, 15.4], [19.2, 18.4]], 20);
  trilha(g, [[15.5, 13.8], [22, 14.6], [28.5, 15.4], [34.4, 18.6], [37.2, 16.4]], 18);
  trilha(g, [[12.6, 14.2], [11.2, 18.4], [10.1, 23.8]], 16);
  trilha(g, [[22.8, 19.6], [25.6, 21.4], [26.8, 23.8]], 14);
  trilha(g, [[20.6, 11.4], [25.6, 11.8], [29.4, 11.4]], 14);
  /* folhas caídas, pedrinhas, cogumelos */
  for (let i = 0; i < 700; i++) {
    const x = r() * LW, y = r() * LH;
    g.fillStyle = ['rgba(200,160,60,0.5)', 'rgba(170,110,40,0.45)', 'rgba(120,150,50,0.5)', 'rgba(150,90,40,0.4)'][Math.floor(r() * 4)];
    g.beginPath(); g.ellipse(x, y, 3 + r() * 2, 1.4, r() * 3, 0, 7); g.fill();
  }
  for (let i = 0; i < 160; i++) {
    const x = r() * LW, y = r() * LH;
    g.fillStyle = 'rgba(60,50,40,0.25)'; g.beginPath(); g.ellipse(x + 1, y + 1.5, 3, 1.6, 0, 0, 7); g.fill();
    g.fillStyle = ['#a8a296', '#bab4a6', '#8e887c'][Math.floor(r() * 3)]; g.beginPath(); g.ellipse(x, y, 2.6 + r() * 1.5, 1.8, 0, 0, 7); g.fill();
  }
  g.restore();
  /* capim alto na borda da mata com a areia */
  for (let i = 0; i < 520; i++) {
    const a = r() * Math.PI * 2, esc = 0.93 + r() * 0.025, f = formaIlha(a) * esc;
    const x = (ILHA.x + Math.cos(a) * ILHA.rx * f) * PX, y = (ILHA.y + Math.sin(a) * ILHA.ry * f) * PX;
    g.strokeStyle = r() < 0.5 ? 'rgba(90,140,50,0.9)' : 'rgba(120,160,60,0.85)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y - 7); g.moveTo(x, y); g.lineTo(x + 1, y - 9); g.moveTo(x, y); g.lineTo(x + 4, y - 6); g.stroke();
  }
  /* conchas, estrelas-do-mar e troncos na praia */
  for (let i = 0; i < 40; i++) {
    const a = r() * Math.PI * 2, f = formaIlha(a) * (0.955 + r() * 0.03);
    const x = (ILHA.x + Math.cos(a) * ILHA.rx * f) * PX, y = (ILHA.y + Math.sin(a) * ILHA.ry * f) * PX;
    if (i % 9 === 0) {
      g.fillStyle = '#e8803a'; g.beginPath();
      for (let k = 0; k < 10; k++) { const rr = k % 2 ? 2.2 : 6, aa = k / 10 * Math.PI * 2; g.lineTo(x + Math.cos(aa) * rr, y + Math.sin(aa) * rr); }
      g.fill();
    } else if (i % 7 === 0) {
      g.save(); g.translate(x, y); g.rotate(a);
      g.fillStyle = '#9a7a52'; g.fillRect(-16, -3, 32, 6); g.fillStyle = '#b8966a'; g.fillRect(-16, -3, 32, 2);
      g.restore();
    } else { g.fillStyle = r() < 0.5 ? '#fff4ec' : '#f4c8c0'; g.beginPath(); g.ellipse(x, y, 2.4, 1.8, a, 0, 7); g.fill(); }
  }
  /* morros */
  for (const m of MORROS) desenharMorro(g, m);
  /* riacho em cima do morro que vira cachoeira, e a poça embaixo */
  const m0 = MORROS[0], topoX = CACHOEIRA.x * PX, bordaY = (CACHOEIRA.y - 0.4 - ALTURA_MORRO) * PX;
  g.save(); g.lineCap = 'round';
  for (const [w, cor] of [[11, '#2f7fae'], [6, '#5ab4e0']]) {
    g.strokeStyle = cor; g.lineWidth = w; g.beginPath(); g.moveTo((m0.x + 0.9) * PX, (m0.y - 0.6) * PX);
    g.quadraticCurveTo((m0.x - 0.2) * PX, (m0.y + 0.4) * PX, topoX, bordaY); g.stroke();
  }
  g.restore();
  g.fillStyle = '#b89c66'; g.beginPath(); g.ellipse(CACHOEIRA.x * PX, CACHOEIRA.y * PX, CACHOEIRA.rx * PX + 6, CACHOEIRA.ry * PX + 5, 0, 0, 7); g.fill();
  gr = g.createRadialGradient(CACHOEIRA.x * PX, CACHOEIRA.y * PX, 3, CACHOEIRA.x * PX, CACHOEIRA.y * PX, CACHOEIRA.rx * PX);
  gr.addColorStop(0, '#2a74a8'); gr.addColorStop(1, '#5ab0d8');
  g.fillStyle = gr; g.beginPath(); g.ellipse(CACHOEIRA.x * PX, CACHOEIRA.y * PX, CACHOEIRA.rx * PX, CACHOEIRA.ry * PX, 0, 0, 7); g.fill();
  /* sombra da mata embaixo das árvores */
  for (const o of objetos) if (o.tipo === 'arvore' || o.tipo === 'palmeira') {
    const rg = g.createRadialGradient(o.x * PX, o.y * PX, 4, o.x * PX, o.y * PX, 62);
    rg.addColorStop(0, 'rgba(30,60,20,0.3)'); rg.addColorStop(1, 'rgba(30,60,20,0)');
    g.fillStyle = rg; g.fillRect(o.x * PX - 62, o.y * PX - 62, 124, 124);
  }
  /* lagoa */
  const lx = LAGOA.x * PX, ly = LAGOA.y * PX, lrx = LAGOA.rx * PX, lry = LAGOA.ry * PX;
  g.fillStyle = '#d6c08c'; g.beginPath(); g.ellipse(lx, ly, lrx + 14, lry + 12, 0, 0, 7); g.fill();
  g.fillStyle = '#b89c66'; g.beginPath(); g.ellipse(lx, ly, lrx + 5, lry + 4, 0, 0, 7); g.fill();
  gr = g.createRadialGradient(lx, ly, 6, lx, ly, lrx);
  gr.addColorStop(0, '#2a74a8'); gr.addColorStop(1, '#58aad4');
  g.fillStyle = gr; g.beginPath(); g.ellipse(lx, ly, lrx, lry, 0, 0, 7); g.fill();
  for (let i = 0; i < 26; i++) {
    const a = r() * Math.PI * 2, x = lx + Math.cos(a) * (lrx + 6), y = ly + Math.sin(a) * (lry + 5);
    g.strokeStyle = '#4a7a2a'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 13); g.moveTo(x + 2, y); g.lineTo(x + 3, y - 10); g.stroke();
    if (i % 4 === 0) { g.fillStyle = '#6a4a2a'; g.fillRect(x - 3, y - 17, 3, 7); }
  }
  /* capim e flores */
  for (let i = 0; i < 1500; i++) {
    const x = r() * LW, y = r() * LH;
    if (distIlha(x / PX, y / PX) > 0.93 || ehLagoa(x / PX, y / PX) || noParedao(x / PX, y / PX)) continue;
    g.strokeStyle = r() < 0.5 ? 'rgba(60,108,40,0.9)' : 'rgba(84,130,48,0.9)'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 5); g.moveTo(x, y); g.lineTo(x, y - 6); g.moveTo(x, y); g.lineTo(x + 2, y - 5); g.stroke();
  }
  for (let i = 0; i < 220; i++) {
    const x = r() * LW, y = r() * LH;
    if (distIlha(x / PX, y / PX) > 0.93 || ehLagoa(x / PX, y / PX)) continue;
    g.fillStyle = ['#fff6d0', '#ffffff', '#ffd84a', '#f0a0d0', '#b8a0ff'][Math.floor(r() * 5)];
    g.beginPath(); g.arc(x, y, 1.9, 0, 7); g.fill();
  }
  for (let i = 0; i < 26; i++) {
    const x = r() * LW, y = r() * LH;
    if (distIlha(x / PX, y / PX) > 0.85 || ehLagoa(x / PX, y / PX)) continue;
    g.fillStyle = '#f4ecd8'; g.fillRect(x - 1, y - 5, 2, 5);
    g.fillStyle = '#d8342c'; g.beginPath(); g.ellipse(x, y - 5, 4.5, 3, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 1.5, y - 6.5, 0.8, 0, 7); g.arc(x + 1.8, y - 6, 0.7, 0, 7); g.fill();
  }
  desenharVila(g);
  chao = c;

  /* minimapa */
  miniBase = document.createElement('canvas');
  miniBase.width = ML * 4; miniBase.height = MA * 4;
  const m = miniBase.getContext('2d');
  m.fillStyle = '#2a6e9a'; m.fillRect(0, 0, ML * 4, MA * 4);
  m.save(); m.scale(4 / PX, 4 / PX);
  m.fillStyle = '#d9c48c'; caminhoIlha(m, 1); m.fill();
  m.fillStyle = '#6a9a44'; caminhoIlha(m, 0.94); m.fill();
  m.fillStyle = '#6a9a44'; caminhoContinente(m, 0.3); m.fill();
  for (const mo of MORROS) { m.fillStyle = '#8a7e68'; m.beginPath(); m.ellipse(mo.x * PX, (mo.y + 0.4) * PX, mo.rx * PX, (mo.ry + 0.5) * PX, 0, 0, 7); m.fill(); m.fillStyle = '#8ab85a'; m.beginPath(); m.ellipse(mo.x * PX, mo.y * PX, mo.rx * PX, mo.ry * PX, 0, 0, 7); m.fill(); }
  m.restore();
  for (const o of objetos) if (BLOQUEIA[o.tipo]) { m.fillStyle = o.tipo === 'pedra' ? '#9a968e' : '#2e5e24'; m.fillRect(o.x * 4 - 1.5, o.y * 4 - 1.5, 3, 3); }
  m.fillStyle = '#3d8cc0'; m.beginPath(); m.ellipse(LAGOA.x * 4, LAGOA.y * 4, LAGOA.rx * 4, LAGOA.ry * 4, 0, 0, 7); m.fill();
  m.beginPath(); m.ellipse(CACHOEIRA.x * 4, CACHOEIRA.y * 4, CACHOEIRA.rx * 4, CACHOEIRA.ry * 4, 0, 0, 7); m.fill();
  m.fillStyle = '#e0d0b0'; for (const [x, y] of CASAS_VILA) m.fillRect(x * 4 - 4, y * 4 - 4, 8, 6);
}

const CASAS_VILA = [[45.9, 4.8, '#f3e2c2'], [46.1, 10.4, '#f5c9c0'], [45.8, 22.4, '#cfe2ef'], [46.1, 28.2, '#f5e6a8']];
function desenharVila(g) {
  /* estrada de terra */
  g.save(); g.lineCap = 'round';
  g.strokeStyle = '#c9ab7c'; g.lineWidth = 0.9 * PX; g.beginPath();
  for (let y = -1; y <= MA + 1; y += 0.5) g.lineTo((margemVila(y) + 1.6) * PX, y * PX);
  g.stroke(); g.restore();
  /* píer onde a canoa chega */
  const py = 16.4 * PX, px0 = (margemVila(16.4) - 1.6) * PX, px1 = (margemVila(16.4) + 0.4) * PX;
  g.fillStyle = 'rgba(20,40,60,0.3)'; g.fillRect(px0 + 4, py - 14, px1 - px0, 36);
  for (let x = px0; x < px1; x += 9) { g.fillStyle = (x / 9) % 2 < 1 ? '#a8784a' : '#9a6c40'; g.fillRect(x, py - 18, 8, 34); }
  g.fillStyle = '#6a4424'; for (const yy of [py - 20, py + 14]) for (let x = px0; x < px1; x += 22) g.fillRect(x, yy, 5, 8);
  for (const [x, y, cor] of CASAS_VILA) {
    const cx = x * PX, base = y * PX;
    g.fillStyle = 'rgba(20,30,10,0.25)'; g.beginPath(); g.ellipse(cx + 8, base + 2, 40, 9, 0, 0, 7); g.fill();
    g.fillStyle = cor; g.fillRect(cx - 32, base - 36, 64, 36);
    g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(cx + 10, base - 36, 22, 36);
    g.strokeStyle = 'rgba(80,60,40,0.4)'; g.lineWidth = 1; g.strokeRect(cx - 32, base - 36, 64, 36);
    const gt = g.createLinearGradient(0, base - 62, 0, base - 32); gt.addColorStop(0, '#d8664a'); gt.addColorStop(1, '#a8402a');
    g.fillStyle = gt;
    g.beginPath(); g.moveTo(cx - 40, base - 32); g.lineTo(cx - 26, base - 62); g.lineTo(cx + 26, base - 62); g.lineTo(cx + 40, base - 32); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(120,40,20,0.6)';
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(cx - 40 + i * 3.5, base - 32 - i * 7.5); g.lineTo(cx + 40 - i * 3.5, base - 32 - i * 7.5); g.stroke(); }
    g.fillStyle = '#7a4a26'; g.fillRect(cx - 7, base - 22, 14, 22);
    g.fillStyle = '#5a8ab0'; g.fillRect(cx + 14, base - 26, 12, 10); g.fillRect(cx - 26, base - 26, 12, 10);
    g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(cx + 14, base - 26, 12, 10); g.strokeRect(cx - 26, base - 26, 12, 10);
    g.fillStyle = '#4a8a3a'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(cx - 40 + i * 6, base - 4, 6, 0, 7); g.fill(); }
    g.fillStyle = '#8a8278'; g.fillRect(cx + 16, base - 70, 9, 16); g.fillStyle = '#6a6258'; g.fillRect(cx + 15, base - 72, 11, 4);
    g.fillStyle = '#7a5a3a'; for (let i = 0; i < 6; i++) g.fillRect(cx - 32 + i * 13, base + 10, 3, 12);
    g.fillRect(cx - 32, base + 13, 68, 2); g.fillRect(cx - 32, base + 19, 68, 2);
    for (let i = 0; i < 5; i++) { g.fillStyle = ['#ff6a8a', '#ffd040', '#ffffff', '#c080ff', '#ff9a3a'][i]; g.beginPath(); g.arc(cx - 26 + i * 12, base + 6, 3, 0, 7); g.fill(); }
  }
  /* coqueiros na beira do continente */
  for (const [x, y] of [[44.6, 2.2], [44.4, 7.8], [44.7, 13.0], [44.6, 20.2], [44.5, 25.4], [44.8, 31.0], [47.0, 7.4], [47.2, 18.8], [47.1, 25.0]]) {
    const cx = x * PX, base = y * PX;
    g.fillStyle = 'rgba(20,40,20,0.25)'; g.beginPath(); g.ellipse(cx + 14, base, 22, 6, 0, 0, 7); g.fill();
    g.strokeStyle = '#8a6a42'; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, base); g.quadraticCurveTo(cx + 4, base - 30, cx + 10, base - 62); g.stroke();
    for (const a of [-2.8, -2.2, -1.6, -1.0, -0.4, 0.2]) {
      g.fillStyle = a < -1.3 ? '#2f7a2c' : '#3f8a34';
      g.beginPath(); g.moveTo(cx + 10, base - 62);
      g.quadraticCurveTo(cx + 10 + Math.cos(a) * 18, base - 62 + Math.sin(a) * 18 - 6, cx + 10 + Math.cos(a) * 32, base - 62 + Math.sin(a) * 32 + 10);
      g.quadraticCurveTo(cx + 10 + Math.cos(a) * 14, base - 62 + Math.sin(a) * 14 + 4, cx + 10, base - 62); g.fill();
    }
    g.fillStyle = '#6a4a22'; g.beginPath(); g.arc(cx + 7, base - 58, 3.5, 0, 7); g.arc(cx + 13, base - 57, 3.5, 0, 7); g.fill();
  }
  /* barquinho amarrado no píer */
  const bx = (margemVila(ILHA.y) - 1.0) * PX, byy = (ILHA.y - 0.9) * PX;
  g.fillStyle = 'rgba(10,30,50,0.3)'; g.beginPath(); g.ellipse(bx + 3, byy + 5, 30, 8, 0, 0, 7); g.fill();
  g.fillStyle = '#e8e2d4'; g.beginPath(); g.moveTo(bx - 30, byy); g.quadraticCurveTo(bx, byy - 12, bx + 30, byy); g.quadraticCurveTo(bx, byy + 11, bx - 30, byy); g.fill();
  g.fillStyle = '#2a6ab0'; g.fillRect(bx - 26, byy - 1, 52, 3);
  g.fillStyle = '#7a5a3a'; g.beginPath(); g.ellipse(bx, byy - 1, 22, 5, 0, 0, 7); g.fill();
  /* placa */

  g.fillStyle = '#6a4424'; g.fillRect(sx - 2, sy - 30, 4, 30);
  g.fillStyle = '#a8784a'; g.fillRect(sx - 22, sy - 40, 44, 16);
  g.fillStyle = '#fff'; g.font = fonte(11, 'bold'); g.textAlign = 'center'; g.fillText('VILA', sx, sy - 28);
}

/* ---- ícones especiais ---- */
function iconeIsqueiro(x, y, s) {
  caixa(x - s * 0.22, y - s * 0.2, s * 0.44, s * 0.6, s * 0.08, '#d8342c', '#8a1a14', 1);
  caixa(x - s * 0.22, y - s * 0.36, s * 0.44, s * 0.18, s * 0.04, '#c8ccd4', '#7a7e86', 1);
  const f = Math.sin(anim * 14) * s * 0.03;
  ctx.fillStyle = '#ffb030';
  ctx.beginPath(); ctx.moveTo(x - s * 0.1, y - s * 0.38); ctx.quadraticCurveTo(x - s * 0.1, y - s * 0.6, x + f, y - s * 0.7);
  ctx.quadraticCurveTo(x + s * 0.12, y - s * 0.55, x + s * 0.1, y - s * 0.38); ctx.fill();
  circ(x, y - s * 0.46, s * 0.05, '#fff2a0');
}
function iconeRemo(x, y, s) {
  lin(x - s * 0.32, y + s * 0.32, x + s * 0.18, y - s * 0.18, '#9a6a3a', s * 0.09);
  elip(x + s * 0.26, y - s * 0.26, s * 0.12, s * 0.24, '#b07a42', Math.PI / 4);
}
function desenharIcone(ficha, x, y, s) {
  if (ficha === 'isqueiro') return iconeIsqueiro(x, y, s);
  if (ficha === 'remo') return iconeRemo(x, y, s);
  txt(ficha, x, y + 1, s * 0.78, '#000', 'normal', 'center', null, 'middle');
}

/* ---- plantas e pedras ---- */
const BOLAS = [[0, -44, 19], [-16, -35, 15], [16, -35, 15], [-9, -57, 14], [10, -56, 14], [0, -30, 14], [-1, -67, 10]];
const PALETAS = [['#1c5422', '#2e7c32', 'rgba(124,190,92,0.55)', 'rgba(16,60,24,0.35)'], ['#235019', '#3a7a26', 'rgba(156,200,92,0.5)', 'rgba(26,62,16,0.35)'],
                 ['#174a2c', '#2a6e42', 'rgba(110,180,124,0.5)', 'rgba(14,54,32,0.35)']];
/* o vento balança as copas: quase nada no sol, bastante na tempestade */
/* quando o vento começa a soprar forte é porque vem chuva ou tempestade (o aviso) */
const ventoDeAviso = () => previsao ? clamp(1 - proximoEvento / AVISO_CHUVA, 0, 1) : 0;
const forcaVento = () => clima === 'tempestade' ? 1 : clima === 'chuva' ? 0.45 : 0.12 + 0.75 * ventoDeAviso();
const balanco = o => Math.sin(anim * (1.1 + o.var * 0.8) + o.var * 20) * forcaVento() * 0.1 + (clima === 'tempestade' ? 0.06 : 0);

function desenharToco(x, base) {
  sombra(x + 2, base - 3, 10, 4);
  ctx.fillStyle = '#6a4424'; ctx.fillRect(x - 7, base - 9, 14, 6);
  elip(x, base - 3, 7, 3, '#6a4424');
  elip(x, base - 9, 7, 3, '#d8b07a');
  ctx.strokeStyle = '#a87a48'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, base - 9, 3.5, 1.5, 0, 0, 7); ctx.stroke();
}

function comQueda(o, bx, base, desenho) {
  ctx.save();
  ctx.translate(bx, base); ctx.rotate(o.ladoQueda * o.caindo * o.caindo * 1.5); ctx.translate(-bx, -base);
  ctx.globalAlpha = 1 - Math.max(0, o.caindo - 0.65) / 0.35;
  desenho();
  ctx.restore();
}

function desenharArvore(o) {
  const bx = o.x * PX, base = o.y * PX + 9;
  if (o.qtd <= 0 && !o.caindo) return desenharToco(bx, base);
  const e = (0.66 + 0.34 * Math.max(1, o.qtd) / o.max) * (0.86 + o.var * 0.3);
  const cx = bx + (o.tremor > 0 ? Math.sin(anim * 60) * 2.2 * o.tremor : 0);
  const pal = PALETAS[Math.floor(o.var * 3)];
  const copa = () => {
    const tw = 9 * e, th = 30 * e;
    const tg = ctx.createLinearGradient(cx - tw / 2, 0, cx + tw / 2, 0);
    tg.addColorStop(0, '#9a6a3c'); tg.addColorStop(0.6, '#6e4a28'); tg.addColorStop(1, '#4a3018');
    ctx.fillStyle = tg; ctx.fillRect(cx - tw / 2, base - th, tw, th);
    poli([[cx - tw / 2, base - 1], [cx - tw / 2 - 5 * e, base + 1], [cx - tw / 2, base - 8 * e]], '#7a5230');
    poli([[cx + tw / 2, base - 1], [cx + tw / 2 + 5 * e, base + 1], [cx + tw / 2, base - 8 * e]], '#5a3c20');
    lin(cx - 1, base - th * 0.8, cx - 1.5, base - th * 0.3, 'rgba(40,24,10,0.5)', 1);
    lin(cx + 2, base - th * 0.6, cx + 2.5, base - th * 0.15, 'rgba(40,24,10,0.45)', 1);
    ctx.save(); ctx.translate(cx, base - th * 0.5); ctx.transform(1, 0, -balanco(o), 1, 0, 0); ctx.translate(-cx, -(base - th * 0.5));
    for (const [bx2, by2, br] of BOLAS) circ(cx + bx2 * e + 2, base + by2 * e + 3, br * e + 1.5, pal[0]);
    for (const [bx2, by2, br] of BOLAS) circ(cx + bx2 * e, base + by2 * e, br * e, pal[1]);
    for (const [bx2, by2, br] of BOLAS) circ(cx + (bx2 + br * 0.28) * e, base + (by2 + br * 0.3) * e, br * 0.62 * e, pal[3]);
    for (const [bx2, by2, br] of BOLAS) circ(cx + (bx2 - br * 0.3) * e, base + (by2 - br * 0.35) * e, br * 0.45 * e, pal[2]);
    let sd = Math.floor(o.var * 100000);
    const rr = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 16; i++) {
      const b = BOLAS[Math.floor(rr() * BOLAS.length)], a = rr() * 6.28, d = rr() * b[2] * 0.8;

function folha(x, y, ang, comp, larg, cai, cor, nerv) {
  const ex = x + Math.cos(ang) * comp, ey = y + Math.sin(ang) * comp + cai;

}

function desenharPalmeira(o) {
  const bx = o.x * PX, base = o.y * PX + 9;

  const e = (0.7 + 0.3 * Math.max(1, o.qtd) / o.max) * (0.86 + o.var * 0.28);

  const inc = (o.var - 0.5) * 26 * e + balanco(o) * 70 * e;
  const tx = cx + inc, ty = base - 64 * e;
  const corpo = () => {
    const N = 8, pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, x = (1 - t) * (1 - t) * cx + 2 * (1 - t) * t * (cx + inc * 0.1) + t * t * tx;
      const y = (1 - t) * (1 - t) * base + 2 * (1 - t) * t * (base - 36 * e) + t * t * ty;
      pts.push([x, y, lerp(7, 4, t) * e]);

    pts.forEach(([x, y, w], i) => i ? ctx.lineTo(x - w, y) : ctx.moveTo(x - w, y));
    for (let i = N; i >= 0; i--) ctx.lineTo(pts[i][0] + pts[i][2], pts[i][1]);
    ctx.fill();
    for (let i = 1; i < N; i++) lin(pts[i][0] - pts[i][2], pts[i][1], pts[i][0] + pts[i][2], pts[i][1] + 1.5, '#6a4e2e', 1.2);
    const angs = [-2.9, -2.4, -1.9, -1.25, -0.7, -0.25, 3.3];
    for (const a of angs) folha(tx, ty, a, 32 * e, 7 * e, 12 * e, '#1f6a2a');
    for (const a of angs) folha(tx, ty - 2, a + 0.12, 28 * e, 5.5 * e, 9 * e, '#3a9040', '#1f5a24');
    circ(tx - 4, ty + 3, 3.6 * e, '#6b4a22'); circ(tx + 3, ty + 4, 3.6 * e, '#7a5428'); circ(tx, ty + 7, 3.4 * e, '#5e4020');
  };
  if (o.caindo) { desenharToco(bx, base); comQueda(o, bx, base, corpo); return; }
  sombra(cx + 10 + inc, base - 1, 26 * e, 7);

}

/* ---- o aldeão ---- */
function desenharAldeao() {
  if (jog.dormindo) return;
  const fx = jog.x * PX, fy = jog.y * PX + 6;
  ctx.save(); ctx.translate(fx, fy); ctx.scale(1.3, 1.3);

}

function desenharEmPe() {
  const s = jog.olhandoEsq ? -1 : 1, a = jog.acao, f = ferramenta();
  const bal = jog.andando ? Math.sin(jog.passo * 13) : 0;

    const dx = s * Math.cos(ang), dy = Math.sin(ang), px = -s * Math.sin(ang), py = Math.cos(ang);
    const ox = s * 3, oy = ombro + 1, hx = ox + dx * 10, hy = oy + dy * 10, ex = ox + dx * 26, ey = oy + dy * 26;

let vinheta = null;
function desenharClimaTela() {

    }

    const n = clima === 'tempestade' ? 260 : 140, vento = clima === 'tempestade' ? 8 : 3;
    ctx.strokeStyle = 'rgba(205,222,255,0.45)'; ctx.lineWidth = 1.1; ctx.beginPath();
    for (let i = 0; i < n; i++) { const x = Math.random() * (W + 40) - 20, y = Math.random() * H; ctx.moveTo(x, y); ctx.lineTo(x - vento, y + 14); }
    ctx.stroke();
  }

    if (abrigo && abrigo.nivel >= 3) luz(abrigo.x * PX - camX, (abrigo.y + 1) * PX - camY - 30, 60, 0.6);

/* ---- balão de pensamento ---- */
function nuvemDoBalao(bx, by, larg, alt, sx, sy) {
  const branco = 'rgba(255,255,255,0.96)';
  circ(sx + 6, sy - 6, 4, branco); circ(sx + 14, sy - 18, 6, branco);
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillStyle = branco; ctx.beginPath();

  for (let i = 0; i <= n; i++) {

    ctx.moveTo(x + 18, by + 6); ctx.arc(x, by + 6, 18, 0, Math.PI * 2);
    ctx.moveTo(x + 18, by + alt - 6); ctx.arc(x, by + alt - 6, 18, 0, Math.PI * 2);
  }
  ctx.roundRect(bx, by, larg, alt, 26);
  ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}

function fichasDoBalao(b, x0, y, passo, tam, atraso) {
  b.fichas.forEach((f, i) => {
    const k = clamp((b.t - atraso - i * 0.3) * 4, 0, 1);
    if (k <= 0) return;
    const pop = k < 1 ? 0.6 + k * 0.6 : 1;
    ctx.save(); ctx.translate(x0 + i * passo, y); ctx.scale(pop, pop);
    if (f === '+' || f === '=' || f === '➜') txt(f, 0, 1, tam * 0.7, '#7a6a5a', 'bold', 'center', null, 'middle');
    else desenharIcone(f, 0, 0, tam);

}

function desenharBalao() {
  if (!baloes.length || cena === 'ceu') return;

  const sx = jog.x * PX - camX, sy = jog.y * PX - camY - 62;

  elip(0, 0, 26, 4, 'rgba(0,0,0,0.15)');
  const alt = 44 * Math.min(1, k * 1.4);
  lin(-24, 0, 0, -alt, '#7a5430', 3); lin(24, 0, 0, -alt, '#7a5430', 3);
  const folhas = Math.max(0, (k - 0.3) / 0.7);
  if (folhas > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(-30, -alt * folhas - 2, 60, alt * folhas + 4); ctx.clip();
    poli([[0, -44], [-24, 0], [24, 0]], '#3f8a34');
    for (let i = 0; i < 6; i++) lin(-20 + i * 2, -6 - i * 7, 20 - i * 2, -6 - i * 7, 'rgba(30,80,30,0.6)', 1);
    ctx.restore();
    if (folhas > 0.8) poli([[0, -18], [-8, 0], [8, 0]], '#1a1a10');
  }
  ctx.restore();
}

function miniFogo(x, y, k) {
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; elip(x + Math.cos(a) * 10, y - 2 + Math.sin(a) * 3, 3, 2.5, '#9a968e'); }
  lin(x - 8, y - 2, x + 8, y - 6, '#5a3a1e', 3.5); lin(x - 8, y - 6, x + 8, y - 2, '#6a4424', 3.5);
  if (k <= 0) return;
  const fl = Math.sin(anim * 13) * 2;
  const chama = (w, h, cor) => { ctx.fillStyle = cor; ctx.beginPath(); ctx.moveTo(x - w, y - 4); ctx.quadraticCurveTo(x - w, y - h * 0.6, x + fl * 0.5, y - h); ctx.quadraticCurveTo(x + w, y - h * 0.6, x + w, y - 4); ctx.fill(); };
  chama(8, 22 * k, '#e8541c'); chama(5.5, 16 * k, '#f5a623'); chama(3, 10 * k, '#ffe36b');
}

function aguinha(x0, y, w) {
  ctx.fillStyle = '#62b4e4'; ctx.fillRect(x0, y, w, 40);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) {
    const x = x0 + 10 + ((i * 27 + anim * 12) % (w - 10));
    ctx.beginPath(); ctx.moveTo(x - 6, y + 6 + (i % 2) * 7); ctx.quadraticCurveTo(x, y + 9 + (i % 2) * 7, x + 6, y + 6 + (i % 2) * 7); ctx.stroke();
  }
}

function desenharCenaImaginada(c, t) {
  const L = 216, A = 110, chao = 92;
  const g = ctx.createLinearGradient(0, 0, 0, A); g.addColorStop(0, '#e2f3ff'); g.addColorStop(1, '#fbf3dc');
  ctx.fillStyle = g; ctx.fillRect(0, 0, L, A);
  circ(190, 18, 9, 'rgba(255,220,90,0.8)');
  ctx.fillStyle = '#a8d68a'; ctx.fillRect(0, chao, L, A - chao);
  elip(L / 2, chao + 1, L * 0.62, 5, '#b8e09a');
  if (c === 'cortar') {
    const fase = (t % 0.9) / 0.9;
    const ang = fase < 0.55 ? -2.1 + suave(fase / 0.55) * 2.45 : 0.35 - suave((fase - 0.55) / 0.45) * 2.45;
    const bateu = fase > 0.5 && fase < 0.66;
    miniArvore(146, chao, bateu ? Math.sin(t * 70) * 1.5 : 0);
    mini(112, chao, { dir: 1, braco: ang, ferr: 'machado' });
    if (bateu) for (let i = 0; i < 4; i++) circ(136 + i * 4, chao - 22 - i * 4 - fase * 10, 1.8, '#e2bb84');
    const k = (t % 1.8) / 1.8;
    ctx.save(); ctx.globalAlpha *= 1 - k; txt('+1 🪵', 172, chao - 62 - k * 18, 13, '#6a4a20', 'bold', 'center'); ctx.restore();
  } else if (c === 'pescar') {
    aguinha(118, chao - 2, 100);
    lin(118, chao - 2, 118, A, '#d6c08c', 3);
    mini(98, chao, { dir: 1, braco: -0.5 });
    const ponta = [158, chao - 58];
    lin(106, chao - 27, ponta[0], ponta[1], '#8a6a3a', 2);
    const k = (t % 2.6) / 2.6, morde = k > 0.4 && k < 0.55;
    const boia = [176, chao + 4 + Math.sin(t * 5) * 1.5 + (morde ? 4 : 0)];
    ctx.strokeStyle = 'rgba(80,80,80,0.6)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(...ponta); ctx.quadraticCurveTo(174, chao - 30, ...boia); ctx.stroke();
    circ(boia[0], boia[1], 3, '#e83a2e'); circ(boia[0], boia[1] - 1.6, 1.6, '#fff');
    if (morde) txt('!', 186, chao - 14, 16, '#e83a2e', 'bold', 'center');
    if (k > 0.55) {
      const q = (k - 0.55) / 0.45, fx = lerp(176, 110, q), fy = chao - Math.sin(q * Math.PI) * 44;
      elip(fx, fy, 8, 4, '#7ab0d8', -0.6 + q * 1.2); poli([[fx + 7, fy], [fx + 13, fy - 4], [fx + 13, fy + 4]], '#5a90c0');
      if (q > 0.85) txt('+3 🐟', 100, chao - 58, 13, '#2a5a8a', 'bold', 'center');
    }
  } else if (c === 'faca') {
    const T = 5.5, k = (t % T) / T, cx = 156;
    const pegou = k > 0.82;
    ctx.fillStyle = 'rgba(255,90,60,0.2)';
    ctx.beginPath(); ctx.moveTo(cx + 16, chao - 8); ctx.lineTo(L, chao - 44); ctx.lineTo(L, chao + 18); ctx.closePath(); ctx.fill();
    txt('👀', cx + 36, chao - 24, 12, '#000', 'normal', 'center');
    txt('🚫', cx + 40, chao - 50, 11, '#000', 'normal', 'center');
    if (!pegou) miniCapivara(cx, chao, 1, true);
    else { desenharIcone('🍖', cx, chao - 8, 22); txt('✔', cx - 40, chao - 64, 20, '#2f8a2f', 'bold', 'center'); }
    const x = k < 0.7 ? lerp(24, cx - 24, suave(k / 0.7)) : cx - 24;
    const golpe = k > 0.72 && k < 0.82;
    mini(x, chao, { dir: 1, agachado: !pegou, passo: k < 0.7 ? t * 5 : 0, braco: golpe ? -0.1 : 0.8, ferr: 'faca' });
    if (!pegou) txt('🤫', x, chao - 48, 13, '#000', 'normal', 'center');
    if (k < 0.7) txt('de mansinho ➜', 60, 18, 11, '#5a4a3a', 'bold', 'center');
  } else if (c === 'arco') {
    const k = (t % 2.2) / 2.2;
    miniCapivara(180, chao, -1);
    mini(42, chao, { dir: 1, braco: -0.05 });
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(54, chao - 22, 10, -1.3, 1.3); ctx.stroke();
    const puxa = k < 0.25 ? k / 0.25 : 0;
    lin(54 + Math.cos(1.3) * 10, chao - 22 - Math.sin(1.3) * 10, 54 - puxa * 6, chao - 22, '#ddd', 0.8);
    lin(54 - puxa * 6, chao - 22, 54 + Math.cos(1.3) * 10, chao - 22 + Math.sin(1.3) * 10, '#ddd', 0.8);
    if (k > 0.25 && k < 0.6) {
      const ax = lerp(58, 168, (k - 0.25) / 0.35);
      lin(ax - 14, chao - 22, ax, chao - 22, '#8a5a2a', 2); poli([[ax, chao - 25], [ax + 5, chao - 22], [ax, chao - 19]], '#9aa0aa');
    }
    if (k >= 0.6) txt('🎯', 180, chao - 34, 16, '#000', 'normal', 'center');
  } else if (c === 'construir') {
    const k = (t % 4) / 4;
    miniCasa(150, chao, k);
    const fase = (t % 0.5) / 0.5;
    mini(104, chao, { dir: 1, braco: fase < 0.5 ? -1.5 + suave(fase * 2) * 1.8 : 0.3 - suave((fase - 0.5) * 2) * 1.8, ferr: 'martelo' });

  } else if (c === 'fogo') {
    const k = (t % 4.5) / 4.5;
    miniFogo(140, chao, k < 0.22 ? 0 : Math.min(1, (k - 0.22) * 4));
    if (k < 0.22) {
      mini(112, chao, { dir: 1, braco: 0.4, ferr: 'isqueiro' });
      if (Math.sin(t * 30) > 0) circ(128, chao - 10, 2, '#ffd040');
    } else {
      mini(108, chao, { dir: 1, braco: -0.15 });
      for (let i = 0; i < 3; i++) {
        const q = ((t * 0.7 + i / 3) % 1);
        ctx.save(); ctx.globalAlpha *= 1 - q; desenharIcone('❤️', 96 + i * 10, chao - 50 - q * 26, 12); ctx.restore();
      }
      txt('quentinho!', 60, 20, 11, '#a0502a', 'bold', 'center');
    }
  } else if (c === 'onca' || c === 'cobra') {
    const k = (t % 6) / 6, bicho = (x, fugindo) => c === 'onca' ? miniOnca(x, chao, fugindo ? 1 : -1) : miniCobra(x, chao, fugindo);
    if (k < 0.5) {
      const q = k / 0.5, foge = q > 0.78;
      bicho(170 + (foge ? (q - 0.78) * 220 : 0), foge);
      mini(40, chao, { dir: 1, braco: -0.05 });
      ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(52, chao - 22, 10, -1.3, 1.3); ctx.stroke();
      for (const f0 of (c === 'onca' ? [0.08, 0.42] : [0.2])) {
        if (q > f0 && q < f0 + 0.22) {
          const ax = lerp(58, 162, (q - f0) / 0.22);
          lin(ax - 14, chao - 20, ax, chao - 20, '#8a5a2a', 2); poli([[ax, chao - 23], [ax + 5, chao - 20], [ax, chao - 17]], '#9aa0aa');
        }
        if (q > f0 + 0.22 && q < f0 + 0.32) txt('💥', 168, chao - 30, 16, '#000', 'normal', 'center');
      }
      txt(c === 'onca' ? '🏹 2 flechadas: ela foge!' : '🏹 1 flechada: ela foge!', 108, 16, 12, '#7a3a1a', 'bold', 'center');
    } else {
      const q = (k - 0.5) / 0.5, foge = q > 0.62, golpe = q > 0.38 && q < 0.5;
      bicho(148 + (foge ? (q - 0.62) * 200 : 0), foge);
      mini(q < 0.3 ? lerp(70, 122, q / 0.3) : 122, chao, { dir: 1, braco: golpe ? -0.1 : 0.8, ferr: 'faca', passo: q < 0.3 ? t * 6 : 0 });
      if (golpe) txt('💥', 142, chao - 30, 16, '#000', 'normal', 'center');
      txt(c === 'onca' ? '🔪 de pertinho também!' : '🔪 ou a faca, de pertinho', 108, 16, 12, '#7a3a1a', 'bold', 'center');
    }
  } else if (c === 'remedio') {
    const k = (t % 4.4) / 4.4, cura = k > 0.45;
    const vida = cura ? Math.min(1, 0.25 + (k - 0.45) * 2.2) : 0.25;
    caixa(40, 12, 136, 14, 7, 'rgba(0,0,0,0.25)');
    caixa(42, 14, 132 * vida, 10, 5, vida < 0.4 ? (Math.sin(t * 12) > 0 ? '#ffffff' : '#e04848') : '#e04848');
    desenharIcone('❤️', 30, 19, 16);
    mini(104, chao, { dir: 1, braco: k > 0.3 && k < 0.5 ? -1.6 : 0.9 });
    if (!cura) txt('🤕', 104, chao - 48, 15, '#000', 'normal', 'center');
    if (k > 0.25 && k < 0.5) desenharIcone('💊', 116 - (k - 0.25) * 30, chao - 34 - (k - 0.25) * 20, 16);
    if (cura) for (let i = 0; i < 3; i++) {
      const q = ((t * 0.8 + i / 3) % 1);
      ctx.save(); ctx.globalAlpha *= 1 - q; desenharIcone('❤️', 92 + i * 12, chao - 50 - q * 30, 12); ctx.restore();
    }
    txt(cura ? '+40 ❤️' : 'machucado...', 160, chao - 40, 13, cura ? '#c03030' : '#7a5a4a', 'bold', 'center');
  } else if (c === 'limpar') {
    const k = (t % 6) / 6, limpo = k > 0.5;

    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = limpo ? '#3a9a3a' : '#c83a2a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); quad.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.stroke(); ctx.restore();
    if (!limpo) {
      const fase = (t % 0.9) / 0.9, ang = fase < 0.55 ? -2.1 + suave(fase / 0.55) * 2.45 : 0.35 - suave((fase - 0.55) / 0.45) * 2.45;
      const queda = k > 0.4 ? (k - 0.4) / 0.1 : 0;
      ctx.save(); ctx.translate(156, chao + 4); ctx.rotate(queda * 1.4); miniArvore(0, 0, 0, 0.9); ctx.restore();

}

/* ---- dica do que dá para fazer ---- */
function textoDoAlvo(alvo) {
  const f = ferramenta();
  if (alvo && alvo.tipo === 'portal') return ['🌀', 'entrar no portal e explorar a ilha pré-histórica'];
  if (jog.carregando) return alvo.tipo === 'lancar' ? (tem('remo') ? ['🛶', 'colocar no rio e remar até a vila!'] : ['🛶', 'falta o remo (tecla C)'])
                           : alvo.tipo === 'lagoa' ? ['🌊', 'a lagoa não leva à vila: vá até o rio'] : ['🛶', 'largar a canoa aqui'];
  if (alvo && alvo.tipo === 'pegar') { const c = ACHADOS[alvo.ref.id] || FERR[alvo.ref.id]; return [c.icone, `pegar: ${c.nome.toLowerCase()}`]; }
  if (alvo && COLETAVEIS.includes(alvo.tipo))
    return { arbusto: ['🍒', 'colher frutinhas'], cipo: ['🌿', 'pegar cipó'], erva: ['🌱', 'pegar ervas'], pedra: ['🪨', 'pegar pedras'],
             carne: ['🍖', 'pegar carne'], plastico: ['🛍️', 'pegar plástico'], bananeira: ['🍌', 'pegar bananas'] }[alvo.tipo];
  if (alvo && alvo.tipo === 'presa') return ['🔪', 'atacar!'];
  if (f === 'martelo' && (!alvo || ((alvo.tipo === 'abrigo' || alvo.tipo === 'canoa') && alvo.ref.emObra))) return ['🔨', alvo ? 'construir' : 'construir (ou tecla C)'];
  if (f === 'arco') return ['🏹', 'atirar flecha'];
  if (f === 'remedio') return ['💊', `tomar o remédio (+40 ❤️, sobram ${jog.doses})`];
  if (f === 'isqueiro' && !(alvo && (alvo.tipo === 'abrigo' || alvo.tipo === 'canoa'))) {
    if (alvo && alvo.tipo === 'fogueira') return alvo.ref.comb > 0 ? ['🔥', 'fogo aceso'] : ['🔥', 'acender (3 🪵)'];
    return ['🔥', 'fazer fogueira (3 🪵)'];
  }
  if (!alvo) {
    if (f === 'faca') return ['🤫', 'de mansinho... chegue por trás da capivara'];
    if (f === 'vara') return ['🎣', 'encoste na água para pescar'];
    return null;
  }
  switch (alvo.tipo) {
    case 'arvore': case 'palmeira': return tem('machado') ? ['🪓', 'cortar'] : ['🪓', 'precisa de machado'];
    case 'agua': return tem('vara') ? ['🎣', 'pescar'] : ['🎣', 'precisa de vara'];
    case 'fogueira': return alvo.ref.comb > 0 ? ['🔥', 'fogo aceso (E: comer assado)'] : ['🔥', tem('isqueiro') ? 'acender (3 🪵)' : 'precisa de isqueiro'];
    case 'abrigo': return alvo.ref.emObra ? ['🔨', 'construir'] : ['😴', 'dormir'];
    case 'canoa': return alvo.ref.emObra ? ['🔨', 'construir'] : ['🛶', 'carregar a canoa'];
  }
  return null;
}

function etiqueta(tecla, rotulo, y = H - 124, borda = 'rgba(255,220,140,0.75)') {
  ctx.font = fonte(14, 'bold');
  const lt = Math.max(44, ctx.measureText(tecla).width + 16);
  const w = ctx.measureText(rotulo).width + lt + 18, x = W / 2 - w / 2;
  caixa(x, y, w, 28, 7, UI.painel, UI.borda);
  caixa(x + 6, y + 5, lt, 18, 4, 'rgba(226, 200, 121, 0.2)', 'rgba(226, 200, 121, 0.55)', 1);
  txt(tecla, x + 6 + lt / 2, y + 18, 11, UI.ouro, 'bold', 'center');
  txt(rotulo, x + lt + 12, y + 19, 14, UI.texto, 'bold');
}

/* Setinha em cima do alvo e a etiqueta "Enter: ..." em cima da bandeja. */
function desenharDicaAlvo() {
  if (cena !== 'jogo' || fim || menu || jog.dormindo) return;
  if (construindo()) {
    const ob = jog.acao.alvo, k = clamp(ob.prog / ob.trabalho, 0, 1), w = 300, x = W / 2 - w / 2, y = H - 132;
    caixa(x, y, w, 40, 8, UI.painel, UI.ouro, 1.5);
    txt(`🔨 Construindo: ${jog.acao.nome || ''}`, x + 14, y + 17, 13, UI.texto, 'bold');
    caixa(x + 14, y + 24, w - 28, 9, 4, 'rgba(4, 12, 10, 0.72)');
    caixa(x + 15, y + 25, (w - 30) * k, 7, 3, UI.verde);
    txt(`${Math.round(k * 100)}%`, x + w - 14, y + 17, 12, UI.verde, 'bold', 'right');
    return;
  }
  if (jog.acao && jog.acao.tipo !== 'pescar') return;
  const alvo = acharAlvo();
  const t = textoDoAlvo(alvo);
  if (!t) return;
  if (alvo && alvo.ref !== undefined && alvo.tipo !== 'agua') {
    const alto = { arvore: 92, palmeira: 96, abrigo: 116, pegar: 84, canoa: 30, aviao: 46, presa: 40, caverna: 52 }[alvo.tipo] || 40;
    const pulo = Math.sin(anim * 6) * 3;
    txt('▼', alvo.x * PX - camX, alvo.y * PX - camY - alto + pulo, 16, '#ffe680', 'bold', 'center', 'rgba(0,0,0,0.55)');
  }
  etiqueta(toqueAtivo ? 'Ação' : 'Enter', `${t[0]}  ${t[1]}`);
}

function controlesToque() {
  const escalaControle = clamp(0.84 / escala, 1, 1.5);
  const base = [
    { id: 'cima', x: 92, y: H - 166, r: 30, simbolo: '▲' },
    { id: 'baixo', x: 92, y: H - 90, r: 30, simbolo: '▼' },
    { id: 'esq', x: 54, y: H - 128, r: 30, simbolo: '◀' },
    { id: 'dir', x: 130, y: H - 128, r: 30, simbolo: '▶' },
    { acao: 'usar', x: W - 104, y: H - 150, r: 36, simbolo: '↵', rotulo: 'AÇÃO' },
    { acao: 'trocar', x: W - 200, y: H - 178, r: 27, simbolo: '⇄', rotulo: 'ITEM' },
    { acao: 'comer', x: W - 200, y: H - 98, r: 27, simbolo: 'E', rotulo: 'COMER' },
    { acao: 'construir', x: W - 132, y: H - 62, r: 27, simbolo: 'C', rotulo: 'MONTAR' },
    { acao: 'fogo', x: W - 56, y: H - 98, r: 27, simbolo: 'F', rotulo: 'FOGO' },
    { acao: 'roupas', x: W - 44, y: H - 178, r: 27, simbolo: 'R', rotulo: 'ROUPA' },
  ];
  return base.map(b => ({
    ...b,
    x: b.x < W / 2 ? b.x * escalaControle : W - (W - b.x) * escalaControle,
    y: H - (H - b.y) * escalaControle,
    r: b.r * escalaControle,
  }));
}

function desenharBotaoToque(b) {
  ctx.save();
  const pressionado = !!(b.id && teclas[b.id]);
  ctx.globalAlpha = 0.9;
  ctx.shadowColor = 'rgba(0, 0, 0, 0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  const grad = ctx.createRadialGradient(b.x - b.r * 0.28, b.y - b.r * 0.34, 1, b.x, b.y, b.r);
  grad.addColorStop(0, pressionado ? 'rgba(77, 105, 72, 0.98)' : 'rgba(43, 61, 52, 0.98)');
  grad.addColorStop(1, 'rgba(12, 23, 20, 0.98)');
  circ(b.x, b.y, b.r, grad);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = pressionado ? UI.ouro : b.acao ? 'rgba(226, 200, 121, 0.82)' : 'rgba(210, 224, 190, 0.68)';
  ctx.lineWidth = pressionado ? 3 : 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 5, Math.PI * 1.08, Math.PI * 1.78); ctx.stroke();
  txt(b.simbolo, b.x, b.y + (b.rotulo ? -2 : 1), b.acao ? 20 : 22, UI.texto, 'bold', 'center', null, 'middle');
  if (b.rotulo) txt(b.rotulo, b.x, b.y + 16, 11, UI.ouro, 'bold', 'center', null, 'middle');
  ctx.restore();
}

function desenharControlesToque() {
  if (!toqueAtivo || cena !== 'jogo' || menu || pausado || fim) return;
  for (const b of controlesToque()) desenharBotaoToque(b);
}

  desenharClimaTela();
  desenharDicaAlvo();
  desenharBalao();
  if (cena === 'jogo') desenharHUD();
  desenharMensagens();
  if (cena !== 'jogo') desenharLegendaIntro();
  if (menu) desenharMenu();
  if (pausado) desenharPausa();
  if (fim) desenharFim();
  if (!temFoco()) desenharCliqueParaJogar();
}


/* ======================================================================
   SOM: vento, chuva, trovão, mar, bichos e uma musiquinha (tudo feito aqui mesmo, sem arquivos)
   ====================================================================== */
const som = { ac: null, ligado: true, mestre: null };
try { const v = JSON.parse(localStorage.getItem('selva_som') || 'null'); if (v && v.ligado === false) som.ligado = false; } catch (e) {}
function iniciarSom() {
  if (som.ac) { if (som.ac.state === 'suspended') som.ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  let ac;
  try { ac = som.ac = new AC(); } catch (e) { return; }
  som.mestre = ac.createGain(); som.mestre.gain.value = som.ligado ? 0.9 : 0; som.mestre.connect(ac.destination);
  const n = ac.sampleRate * 3, branco = ac.createBuffer(1, n, ac.sampleRate), marrom = ac.createBuffer(1, n, ac.sampleRate);
  const b = branco.getChannelData(0), m = marrom.getChannelData(0);
  let ult = 0;
  for (let i = 0; i < n; i++) { b[i] = Math.random() * 2 - 1; ult = (ult + 0.02 * b[i]) / 1.02; m[i] = ult * 3.5; }
  som.branco = branco; som.marrom = marrom;
  const laco = (buf, tipo, freq, q = 0.7) => {
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = tipo; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(som.mestre); src.start();
    return { f, g };
  };
  som.vento = laco(marrom, 'lowpass', 300, 0.5);
  som.chuva = laco(branco, 'highpass', 1500);
  som.mar = laco(marrom, 'lowpass', 260, 0.5);
  som.fogo = laco(branco, 'bandpass', 2600, 2);
  som.musica = ac.createGain(); som.musica.gain.value = 0.6; som.musica.connect(som.mestre);
  som.proxNota = ac.currentTime + 0.6; som.passo = 0; som.proxBicho = ac.currentTime + 2;
}
function alternarSom() {
  som.ligado = !som.ligado;
  try { localStorage.setItem('selva_som', JSON.stringify({ ligado: som.ligado })); } catch (e) {}
  iniciarSom();
  if (som.mestre) som.mestre.gain.setTargetAtTime(som.ligado ? 0.9 : 0, som.ac.currentTime, 0.1);
  aviso(som.ligado ? '🔊 Som ligado' : '🔇 Som desligado');
}
const ESCALA = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];
function nota(freq, quando, dur, vol, tipo = 'triangle', destino = som.musica) {
  const ac = som.ac, o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo; o.frequency.value = freq;
  g.gain.setValueAtTime(0, quando); g.gain.linearRampToValueAtTime(vol, quando + 0.015); g.gain.exponentialRampToValueAtTime(0.0008, quando + dur);
  o.connect(g); g.connect(destino); o.start(quando); o.stop(quando + dur + 0.05);
}
function ruido(quando, dur, vol, tipo, freq, q = 1, buf = som.branco) {
  const ac = som.ac, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = tipo; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, quando); g.gain.exponentialRampToValueAtTime(0.0008, quando + dur);
  src.connect(f); f.connect(g); g.connect(som.mestre); src.start(quando, Math.random() * 2); src.stop(quando + dur + 0.05);
  return f;
}
function efeito(nome) {
  if (!som.ac || !som.ligado || !som.branco) return;
  const t = som.ac.currentTime, M = som.mestre;
  if (nome === 'machado') { ruido(t, 0.12, 0.35, 'bandpass', 900, 1.5); nota(110, t, 0.14, 0.25, 'sine', M); }
  else if (nome === 'martelo') { ruido(t, 0.06, 0.3, 'bandpass', 2200, 3); nota(190, t, 0.08, 0.16, 'square', M); }
  else if (nome === 'pegar') { nota(660, t, 0.2, 0.12, 'sine', M); nota(990, t + 0.08, 0.28, 0.12, 'sine', M); }
  else if (nome === 'coletar') nota(520 + Math.random() * 90, t, 0.12, 0.07, 'sine', M);
  else if (nome === 'agua') ruido(t, 0.4, 0.28, 'bandpass', 1100, 0.8);
  else if (nome === 'flecha') ruido(t, 0.25, 0.2, 'bandpass', 2500, 2).frequency.exponentialRampToValueAtTime(600, t + 0.25);
  else if (nome === 'faca') ruido(t, 0.15, 0.22, 'highpass', 3000, 1);
  else if (nome === 'fogo') ruido(t, 0.7, 0.3, 'lowpass', 700, 0.7, som.marrom);
  else if (nome === 'comer') for (let i = 0; i < 3; i++) ruido(t + i * 0.12, 0.06, 0.16, 'bandpass', 1800, 2);
  else if (nome === 'pronto') [523, 659, 784, 1046].forEach((f, i) => nota(f, t + i * 0.12, 0.45, 0.12, 'triangle', M));
  else if (nome === 'vitoria') [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => nota(f, t + i * 0.16, 0.7, 0.14, 'triangle', M));
  else if (nome === 'dano') nota(150, t, 0.28, 0.22, 'sawtooth', M);
  else if (nome === 'cobra') ruido(t, 0.7, 0.18, 'highpass', 4200, 0.8);
  else if (nome === 'tunel') ruido(t, 1.2, 0.25, 'bandpass', 300, 2, som.marrom).frequency.exponentialRampToValueAtTime(1800, t + 1.1);
}
function trovao(atraso = 0) {
  if (!som.ac || !som.ligado || !som.branco) return;
  const t = som.ac.currentTime + atraso;
  ruido(t, 3, 1, 'lowpass', 150, 0.8, som.marrom);
  ruido(t, 0.5, 0.5, 'lowpass', 900, 0.6);
  ruido(t + 0.3, 2.2, 0.6, 'lowpass', 90, 0.8, som.marrom);
}
function atualizarSom() {
  const ac = som.ac;
  if (!ac || !som.vento) return;
  const t = ac.currentTime, jogando = cena === 'jogo' && !pausado && !fim;
  /* no dia a dia o vento fica quietinho; ele só cresce como aviso de que vem perigo */
  const aviso = ventoDeAviso();
  const vento = cena === 'ceu' ? 0.3 : clima === 'tempestade' ? 0.26 : clima === 'chuva' ? 0.1 : 0.2 * aviso * aviso;
  som.vento.g.gain.setTargetAtTime(pausado ? 0 : vento * (0.75 + 0.25 * Math.sin(anim * 0.9)), t, 0.6);
  som.vento.f.frequency.setTargetAtTime(170 + 200 * (0.5 + 0.5 * Math.sin(anim * 0.31)) + aviso * 160 + (clima === 'tempestade' ? 180 : 0), t, 0.8);
  const chuva = clima === 'tempestade' ? 0.32 : clima === 'chuva' ? 0.18 : 0;
  som.chuva.g.gain.setTargetAtTime(jogando ? chuva : 0, t, 0.8);
  const praia = clamp((distIlha(jog.x, jog.y) - 0.55) / 0.45, 0, 1);
  som.mar.g.gain.setTargetAtTime(jogando ? (0.006 + 0.06 * praia) * (0.5 + 0.5 * Math.sin(anim * 0.8)) : 0, t, 0.5);
  som.fogo.g.gain.setTargetAtTime(jogando && fogoPerto(jog.x, jog.y, 4) ? 0.04 + Math.random() * 0.06 : 0, t, 0.05);
  if (!jogando) { som.proxNota = Math.max(som.proxNota, t + 0.3); return; }
  /* musiquinha calma: arpejo pentatônico com baixo; à noite fica mais lenta */
  const noite = escuridao() > 0.5, passoNota = noite ? 0.62 : 0.46;
  while (som.proxNota < t + 0.2) {
    const q = som.proxNota, acorde = [[0, 2, 4, 5], [4, 0, 2, 4], [3, 5, 0, 2], [1, 3, 5, 6]][Math.floor(som.passo / 8) % 4];
    if (clima !== 'tempestade') {
      if (som.passo % 8 === 0) nota(ESCALA[acorde[0]] / 4, q, 1.8, 0.11, 'sine');
      if (Math.random() < 0.7) nota(ESCALA[acorde[Math.floor(Math.random() * acorde.length)]] * (!noite && Math.random() < 0.3 ? 2 : 1), q, 0.75, 0.045, 'triangle');
    }
    som.passo++; som.proxNota += passoNota;
  }
  /* bichos: passarinhos de dia, grilos à noite */
  if (t > som.proxBicho) {
    som.proxBicho = t + 1.5 + Math.random() * 4;
    if (clima === 'sol') {
      if (!noite) {
        const f = 2200 + Math.random() * 1400;
        for (let i = 0; i < 2 + Math.floor(Math.random() * 3); i++) {
          const o = ac.createOscillator(), g = ac.createGain(), q = t + i * 0.13;
          o.type = 'sine'; o.frequency.setValueAtTime(f, q); o.frequency.exponentialRampToValueAtTime(f * 1.4, q + 0.08);
          g.gain.setValueAtTime(0, q); g.gain.linearRampToValueAtTime(0.03, q + 0.02); g.gain.exponentialRampToValueAtTime(0.0005, q + 0.1);
          o.connect(g); g.connect(som.mestre); o.start(q); o.stop(q + 0.12);
        }
      } else for (let i = 0; i < 6; i++) nota(4400, t + i * 0.06, 0.04, 0.01, 'square', som.mestre);
    }
  }
}

/* Sem foco o teclado não chega ao jogo (por exemplo, quando ele está dentro de outra página). */
const temFoco = () => document.hasFocus();
function desenharCliqueParaJogar() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  caixa(W / 2 - 210, H / 2 - 62, 420, 124, 18, 'rgba(36,26,14,0.96)', '#ffd860', 2.5);
  txt(toqueAtivo ? 'Toque aqui para jogar' : '🖱️  Clique aqui para jogar', W / 2, H / 2 - 12, 24, '#fff4d8', 'bold', 'center');
  txt(toqueAtivo ? 'Use os controles na tela para jogar' : 'Use o teclado: setas para andar e Enter para usar', W / 2, H / 2 + 26, 14, '#e8d4ac', 'bold', 'center');
}

/* ======================================================================
   TECLADO E LAÇO PRINCIPAL
   ====================================================================== */

const MAPA_TECLAS = { ArrowLeft: 'esq', a: 'esq', A: 'esq', ArrowRight: 'dir', d: 'dir', D: 'dir',
                      ArrowUp: 'cima', w: 'cima', W: 'cima', ArrowDown: 'baixo', s: 'baixo', S: 'baixo' };
const teclasFisicas = { esq: false, dir: false, cima: false, baixo: false };
const ponteirosToque = new Map();

function atualizarTecla(tecla) {
  teclas[tecla] = teclasFisicas[tecla] || [...ponteirosToque.values()].some(direcoes => direcoes.includes(tecla));
}

function controleToqueEm(x, y) {
  return controlesToque().find(b => Math.hypot(x - b.x, y - b.y) <= b.r + 8);
}

function executarAcaoToque(acao) {
  if (acao === 'usar') usar();
  else if (acao === 'comer') comer();
  else if (acao === 'construir') teclaConstruir();
  else if (acao === 'fogo') teclaFogo();
  else if (acao === 'roupas') teclaRoupas();
  else if (acao === 'trocar') { sel = (sel + 1) % bandeja.length; jog.acao = null; }
}

function tratarToqueNoMenu(x, y) {
  const cw = 168, ch = 148, esp = 14, total = menu.ops.length * cw + (menu.ops.length - 1) * esp;
  const x0 = W / 2 - total / 2, y0 = H / 2 - ch / 2 - 10;
  const indice = Math.floor((x - x0) / (cw + esp));
  const dentroDoCartao = x >= x0 && y >= y0 && y <= y0 + ch && indice >= 0 && indice < menu.ops.length &&
                         x <= x0 + indice * (cw + esp) + cw;
  if (dentroDoCartao) { menu.sel = indice; confirmarMenu(); }
  else menu = null;
}

function selecionarItemToque(x, y) {
  const tam = 54, esp = 8, total = bandeja.length * (tam + esp) - esp, bx0 = W / 2 - total / 2, by = H - 66;
  if (y < by - 6 || y > by + tam || x < bx0 || x > bx0 + total) return false;
  const indice = Math.floor((x - bx0) / (tam + esp));
  if (indice >= bandeja.length || x > bx0 + indice * (tam + esp) + tam) return false;
  sel = indice; jog.acao = null;
  return true;
}

window.addEventListener('keydown', e => {
  const k = e.key;
  iniciarSom();
  if ((k === 'm' || k === 'M') && !e.repeat) return alternarSom();
  if (k === 'Tab' || k.startsWith('Arrow') || k === ' ') e.preventDefault();
  if (cena !== 'jogo') { if ((k === 'Enter' || k === 'Escape' || k === ' ') && !e.repeat) pularIntro(); return; }
  if (fim) { if (k === 'Enter' && tFim > 1 && !e.repeat) novoJogo(); return; }
  if (menu) {
    if (k === 'ArrowLeft' || k === 'a') menu.sel = (menu.sel + menu.ops.length - 1) % menu.ops.length;
    else if (k === 'ArrowRight' || k === 'd') menu.sel = (menu.sel + 1) % menu.ops.length;
    else if ((k === 'Enter' || k === ' ') && !e.repeat) confirmarMenu();
    else if (k === 'Escape' || k === 'Backspace' || k === 'c' || k === 'C' || k === 'r' || k === 'R') menu = null;
    return;
  }
  if (k === 'p' || k === 'P' || k === 'Escape') { pausado = !pausado; return; }
  if (pausado) return;
  if (MAPA_TECLAS[k]) { teclasFisicas[MAPA_TECLAS[k]] = true; atualizarTecla(MAPA_TECLAS[k]); return; }
  if (e.repeat) return;
  if (construindo()) return;
  if (k === 'Enter' || k === ' ') usar();
  else if (k === 'Tab') { sel = (sel + (e.shiftKey ? bandeja.length - 1 : 1)) % bandeja.length; jog.acao = null; }
  else if (k >= '1' && k <= '9' && Number(k) <= bandeja.length) { sel = Number(k) - 1; jog.acao = null; }
  else if (k === 'e' || k === 'E') comer();
  else if (k === 'c' || k === 'C') teclaConstruir();
  else if (k === 'r' || k === 'R') teclaRoupas();
  else if (k === 'f' || k === 'F') teclaFogo();
});
window.addEventListener('keyup', e => {
  const tecla = MAPA_TECLAS[e.key];
  if (tecla) { teclasFisicas[tecla] = false; atualizarTecla(tecla); }
});
window.addEventListener('blur', () => {
  for (const k in teclas) { teclasFisicas[k] = false; teclas[k] = false; }
  ponteirosToque.clear();
});
const BOTAO_PAUSA = { x: W - 250, y: 10, w: 44, h: 44 };
const BOTAO_SOM = { x: W - 250, y: 62, w: 44, h: 44 };
const BOTAO_CONTINUAR = { x: W / 2 - 80, y: H / 2 + 130, w: 160, h: 34 };
let mouseX = -1, mouseY = -1;
const dentroDe = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function posMouse(e) {
  const r = tela.getBoundingClientRect();
  return [(e.clientX - r.left) / escala, (e.clientY - r.top) / escala];
}
tela.addEventListener('pointermove', e => {
  [mouseX, mouseY] = posMouse(e);
  if (ponteirosToque.has(e.pointerId)) {
    const controle = controleToqueEm(mouseX, mouseY);
    ponteirosToque.set(e.pointerId, controle && controle.id ? [controle.id] : []);
    for (const tecla of Object.keys(teclas)) atualizarTecla(tecla);
    return;
  }
  const clicavel = cena === 'jogo' && !fim && !menu && (dentroDe(mouseX, mouseY, BOTAO_PAUSA) || dentroDe(mouseX, mouseY, BOTAO_SOM) || (pausado && dentroDe(mouseX, mouseY, BOTAO_CONTINUAR)));
  tela.style.cursor = clicavel ? 'pointer' : 'default';
});
tela.addEventListener('pointerleave', () => { mouseX = mouseY = -1; });
tela.addEventListener('pointerdown', e => {
  const [x, y] = posMouse(e);
  iniciarSom();
  window.focus(); tela.focus();
  if (e.pointerType === 'touch') e.preventDefault();
  if (e.pointerType === 'touch' && cena !== 'jogo') { pularIntro(); return; }
  if (e.pointerType === 'touch' && fim) { if (tFim > 1) novoJogo(); return; }
  if (e.pointerType === 'touch' && menu) { tratarToqueNoMenu(x, y); return; }
  if (cena !== 'jogo' || fim || menu) return;
  if (dentroDe(x, y, BOTAO_SOM)) return alternarSom();
  if (pausado ? dentroDe(x, y, BOTAO_CONTINUAR) || dentroDe(x, y, BOTAO_PAUSA) : dentroDe(x, y, BOTAO_PAUSA)) pausado = !pausado;
  if (e.pointerType !== 'touch' || !toqueAtivo || pausado) return;
  const controle = controleToqueEm(x, y);
  if (controle && controle.id) {
    ponteirosToque.set(e.pointerId, [controle.id]);
    try { tela.setPointerCapture(e.pointerId); } catch {}
    atualizarTecla(controle.id);
    return;
  }
  if (controle && controle.acao) { executarAcaoToque(controle.acao); return; }
  selecionarItemToque(x, y);
});
window.addEventListener('pointerup', e => {
  if (!ponteirosToque.delete(e.pointerId)) return;
  for (const tecla of Object.keys(teclas)) atualizarTecla(tecla);
});
window.addEventListener('pointercancel', e => {
  if (!ponteirosToque.delete(e.pointerId)) return;
  for (const tecla of Object.keys(teclas)) atualizarTecla(tecla);
});

function pularIntro() {
  if (cena === 'ceu' || cena === 'queda') { destrocoVisivel = true; particula('fumaca', 12.8, 11.2, 6, '#555'); }
  comecarJogo();
  atualizarCamera(0, true);
}

function ajustarTela() {
  dpr = window.devicePixelRatio || 1;
  escala = Math.min(window.innerWidth / W, window.innerHeight / H);
  tela.style.width = Math.floor(W * escala) + 'px';
  tela.style.height = Math.floor(H * escala) + 'px';
  tela.width = Math.floor(W * escala * dpr);
  tela.height = Math.floor(H * escala * dpr);
}
window.addEventListener('resize', ajustarTela);

let ultimo = performance.now();
function laco(t) {
  const dt = Math.min(0.05, (t - ultimo) / 1000);
  ultimo = t;
  if (!pausado && !menu && temFoco()) {
    const mult = jog.dormindo ? 5 : 1;
    let resto = dt * mult;
    while (resto > 0) { const p = Math.min(resto, 0.05); atualizar(p); resto -= p; }
    atualizarVisual(dt);
  }
  atualizarCamera(dt, false);
  atualizarSom();
  desenhar();
  requestAnimationFrame(laco);
}

ajustarTela();
novoJogo();
atualizarCamera(0, true);
tela.focus();
requestAnimationFrame(laco);
</script>
