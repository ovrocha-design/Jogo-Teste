function playerMesh(){const p=new THREE.Group(),cloth=new THREE.MeshStandardMaterial({color:'#795437',roughness:.9}),skin=new THREE.MeshStandardMaterial({color:'#e3b58a',roughness:.88}),dark=new THREE.MeshStandardMaterial({color:'#40332a',roughness:1}),body=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.6,4,8),cloth),head=new THREE.Mesh(new THREE.SphereGeometry(.23,10,8),skin),hair=new THREE.Mesh(new THREE.SphereGeometry(.24,8,6),dark);body.position.y=.77;head.position.y=1.4;hair.position.set(0,1.53,-.02);hair.scale.y=.55;body.castShadow=true;p.add(body,head,hair);for(const s of[-1,1]){const l=new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,.43,6),dark);l.position.set(s*.15,.23,0);p.add(l);}const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.025,.04,2.2,6),new THREE.MeshStandardMaterial({color:'#795637',roughness:.95}));shaft.position.set(.36,1,.48);shaft.rotation.x=Math.PI/2;shaft.castShadow=true;p.add(shaft);const tip=new THREE.Mesh(new THREE.ConeGeometry(.11,.38,5),new THREE.MeshStandardMaterial({color:'#aeb4aa',roughness:.7,metalness:.18}));tip.position.set(.36,1,1.72);tip.rotation.x=Math.PI/2;tip.castShadow=true;p.add(tip);const sh=new THREE.Mesh(new THREE.CircleGeometry(.6,18),new THREE.MeshBasicMaterial({color:'#14251e',transparent:true,opacity:.26}));sh.rotation.x=-Math.PI/2;sh.position.y=.04;p.add(sh);scene.add(p);return p;}const player=playerMesh();player.position.set(-22,0,4);
for(const [i,p]of[[-10,-12],[10,10],[22,-7]].entries()){const[x,z]=p,g=new THREE.Group();g.position.set(x,.18,z);scene.add(g);const bone=new THREE.MeshStandardMaterial({color:'#e8d9a6',roughness:.92});for(let n=0;n<3;n++){const r=new THREE.Mesh(new THREE.TorusGeometry(.32,.055,5,14,Math.PI),bone);r.rotation.x=Math.PI/2;r.rotation.z=(n-1)*.3;r.position.x=(n-1)*.23;g.add(r);}const spine=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,1.3,6),bone);spine.rotation.z=Math.PI/2;g.add(spine);const glowMark=new THREE.Mesh(new THREE.RingGeometry(.7,.9,28),new THREE.MeshBasicMaterial({color:'#e5d47f',transparent:true,opacity:.68,side:THREE.DoubleSide}));glowMark.rotation.x=-Math.PI/2;glowMark.position.y=.025;g.add(glowMark);const tag=label('FÓSSIL '+(i+1),'#f5e5b3');tag.position.y=1.1;g.add(tag);fossils.push({group:g,x,z,found:false});}
function island(x,z){const a=Math.atan2(z/RZ,x/RX),e=1+.045*Math.sin(a*3+.4)+.025*Math.sin(a*7+1.6)+.018*Math.sin(a*11);return Math.hypot(x/RX,z/RZ)<e*.925;}function shallow(x,z){const a=Math.atan2(z/RZ,x/RX),e=1+.045*Math.sin(a*3+.4)+.025*Math.sin(a*7+1.6)+.018*Math.sin(a*11),r=Math.hypot(x/RX,z/RZ);return r>=e*.925&&r<=e*1.02;}function brushHide(){return brush.some(v=>Math.hypot(player.position.x-v.x,player.position.z-v.y)<2.5);}
function say(t,sec=3){const e=document.getElementById('toast');e.textContent=t;e.classList.add('visible');toastUntil=performance.now()+sec*1000;}function updateQuest(){document.getElementById('quest-line').textContent=`Fósseis: ${fossils.filter(f=>f.found).length} / 3 · ${fossils.every(f=>f.found)?'volte ao portal':'depois volte ao portal'}`;}
function use(){const d=Math.hypot(player.position.x-portal.position.x,player.position.z-portal.position.z);if(d<3.2){const count=fossils.filter(f=>f.found).length;if(count<3)say(`Portal de retorno. Faltam ${3-count} fósseis, mas você pode voltar agora.`);window.parent.postMessage({type:'selva-stage2-return',fossils:count},'*');return;}let best=null,md=2.4;for(const f of fossils)if(!f.found){const q=Math.hypot(player.position.x-f.x,player.position.z-f.z);if(q<md){md=q;best=f;}}if(best){best.found=true;best.group.visible=false;updateQuest();say(fossils.every(f=>f.found)?'Todos os fósseis encontrados! Volte pelo portal.':`Fóssil coletado: ${fossils.filter(f=>f.found).length} / 3`);}else say('Explore a ilha e siga os fósseis no minimapa.');}
function predator(e,dt){
	const dx=player.position.x-e.group.position.x,dz=player.position.z-e.group.position.z,d=Math.hypot(dx,dz);
	const fwd=new THREE.Vector3(Math.sin(e.yaw),0,Math.cos(e.yaw)),to=new THREE.Vector3(dx,0,dz).normalize();
	const a=e.kind==='raptor'?Math.PI*.56:Math.PI*.62,range=e.kind==='raptor'?10.5:8.5;
	const inWater=e.kind==='mosasaur'&&shallow(player.position.x,player.position.z);
	const inSight=fwd.dot(to)>Math.cos(a/2),waterRipple=e.kind==='mosasaur'&&inWater&&d<range;
	const seen=d<range&&(inSight||waterRipple)&&!sneak&&!brushHide()&&(e.kind!=='mosasaur'||inWater||d<4);
	if(seen&&!e.alert){e.alert=true;if(e.kind==='mosasaur')say('A água se agitou. O mosassauro percebeu você!',2);}
	if(e.alert){
		e.vision.material.color.set(e.kind==='mosasaur'?'#ff7859':'#ff493e');
		e.yaw=Math.atan2(dx,dz);e.group.rotation.y=e.yaw;
		if(e.kind==='mosasaur'&&!inWater){e.alert=false;return;}
		if(e.kind==='mosasaur'&&d>2.1){e.group.position.x+=Math.sin(e.yaw)*e.speed*.6*dt;e.group.position.z+=Math.cos(e.yaw)*e.speed*.6*dt;}
		else if(e.kind==='raptor'&&d>1.7){e.group.position.x+=Math.sin(e.yaw)*e.speed*dt;e.group.position.z+=Math.cos(e.yaw)*e.speed*dt;}
		if(e.kind==='raptor'&&d<2.2){e.attack-=dt;if(e.attack<=0){e.attack=1.4;health=Math.max(0,health-18);document.getElementById('health-fill').style.width=health+'%';document.getElementById('health-label').textContent=health+'%';say('O predador te alcançou. Fuja para a mata!',1.7);if(!health){health=100;player.position.set(-22,0,4);e.alert=false;document.getElementById('health-fill').style.width='100%';document.getElementById('health-label').textContent='100%';say('Você escapou pelo portal. Os fósseis permanecem com você.');}}}
		if(d>18)e.alert=false;
	}else{
		e.vision.material.color.set(e.kind==='mosasaur'?'#ff7859':'#ff634e');e.phase+=dt;
		if(e.kind==='mosasaur'){e.group.position.x=e.homeX+Math.sin(e.phase*.22)*4.8;e.group.position.z=e.homeZ+Math.cos(e.phase*.22)*2.8;}
		else if(e.kind==='raptor'){e.yaw+=Math.sin(e.phase*.55)*dt*.25;e.group.rotation.y=e.yaw;e.group.position.x+=Math.sin(e.yaw)*e.speed*.2*dt;e.group.position.z+=Math.cos(e.yaw)*e.speed*.2*dt;if(Math.hypot(e.group.position.x-e.homeX,e.group.position.z-e.homeZ)>e.roam)e.yaw=Math.atan2(e.homeX-e.group.position.x,e.homeZ-e.group.position.z);}
	}
	e.group.position.x=THREE.MathUtils.clamp(e.group.position.x,e.kind==='mosasaur'?-34:-30,30);
	e.group.position.z=THREE.MathUtils.clamp(e.group.position.z,-22,22);
}
const updatePredatorBase=predator;
predator=function(e,dt){updatePredatorBase(e,dt);if(e.kind!=='mosasaur')return;const d=Math.hypot(player.position.x-e.group.position.x,player.position.z-e.group.position.z),waterThreat=shallow(player.position.x,player.position.z);if(!e.alert||!waterThreat||d>2.6){e.attack=.8;return;}e.attack-=dt;if(e.attack>0)return;e.attack=2.4;health=Math.max(0,health-10);document.getElementById('health-fill').style.width=health+'%';document.getElementById('health-label').textContent=health+'%';say('Uma sombra passou sob a água. Volte para a areia!',1.7);if(!health){health=100;player.position.set(-22,0,4);e.alert=false;document.getElementById('health-fill').style.width='100%';document.getElementById('health-label').textContent='100%';say('Você escapou para a areia. Os fósseis permanecem com você.');}};
function move(dt){let x=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0),z=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0);if(!x&&!z)return;const n=Math.hypot(x,z);x/=n;z/=n;const v=sneak?2.1:4.1,nx=player.position.x+x*v*dt,nz=player.position.z+z*v*dt;if(island(nx,nz)||shallow(nx,nz)){player.position.x=nx;player.position.z=nz;yaw=Math.atan2(x,z);player.rotation.y=yaw;}}
const map=document.getElementById('minimap'),mg=map.getContext('2d');function drawMap(){const w=map.width,h=map.height,px=x=>w/2+x/(RX*2.2)*w,pz=z=>h/2+z/(RZ*2.2)*h;mg.clearRect(0,0,w,h);mg.fillStyle='#176a78';mg.fillRect(0,0,w,h);for(const sc of[.96,.925]){mg.beginPath();for(let i=0;i<=96;i++){const a=i/96*Math.PI*2,e=1+.045*Math.sin(a*3+.4)+.025*Math.sin(a*7+1.6)+.018*Math.sin(a*11),x=px(Math.cos(a)*RX*e*sc),y=pz(Math.sin(a)*RZ*e*sc);i?mg.lineTo(x,y):mg.moveTo(x,y);}mg.closePath();mg.fillStyle=sc>.94?'#d2bc83':'#698448';mg.fill();}for(const b of brush){mg.fillStyle='rgba(28,66,39,.55)';mg.beginPath();mg.arc(px(b.x),pz(b.y),3,0,7);mg.fill();}for(const f of fossils)if(!f.found){mg.fillStyle='#f0d580';mg.beginPath();mg.arc(px(f.x),pz(f.z),4,0,7);mg.fill();}for(const e of entities){const x=px(e.group.position.x),y=pz(e.group.position.z);mg.fillStyle=e.pred?(e.alert?'#ff493e':'#e58252'):'#a8c581';mg.beginPath();mg.arc(x,y,e.pred?4:3,0,7);mg.fill();if(e.pred){mg.fillStyle=e.alert?'rgba(255,75,55,.2)':'rgba(255,113,78,.1)';mg.strokeStyle=e.alert?'rgba(255,75,55,.75)':'rgba(255,113,78,.38)';mg.beginPath();mg.moveTo(x,y);mg.lineTo(px(e.group.position.x+Math.sin(e.yaw)*5),pz(e.group.position.z+Math.cos(e.yaw)*5));mg.lineTo(px(e.group.position.x+Math.sin(e.yaw-.48)*5),pz(e.group.position.z+Math.cos(e.yaw-.48)*5));mg.closePath();mg.fill();mg.stroke();}}mg.fillStyle='#68f0cf';mg.beginPath();mg.arc(px(player.position.x),pz(player.position.z),5.5,0,7);mg.fill();mg.strokeStyle='#f5f3df';mg.lineWidth=1.5;mg.stroke();mg.strokeStyle='#d7c273';mg.lineWidth=2;mg.beginPath();mg.arc(px(portal.position.x),pz(portal.position.z),6,0,7);mg.stroke();}
function resize(){const a=innerWidth/innerHeight,h=31;camera.left=-h*a/2;camera.right=h*a/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);document.getElementById('orientation').hidden=a>=1;}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Shift'){sneak=true;document.getElementById('action-sneak').classList.add('pressed');return;}if(['e','E','Enter'].includes(e.key)){if(!e.repeat)use();return;}if(e.key==='Escape'){parent.postMessage({type:'selva-stage2-return',fossils:fossils.filter(f=>f.found).length},'*');return;}keys.add(e.key);});addEventListener('keyup',e=>{keys.delete(e.key);if(e.key==='Shift'){sneak=false;document.getElementById('action-sneak').classList.remove('pressed');}});addEventListener('blur',()=>{keys.clear();sneak=false;});
for(const[id,k]of[['move-up','w'],['move-down','s'],['move-left','a'],['move-right','d']]){const b=document.getElementById(id),clear=()=>{keys.delete(k);b.classList.remove('pressed');};b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.classList.add('pressed');try{b.setPointerCapture(e.pointerId);}catch{}});b.addEventListener('pointerup',clear);b.addEventListener('pointercancel',clear);}document.getElementById('action-use').addEventListener('pointerdown',e=>{e.preventDefault();use();});document.getElementById('action-sneak').addEventListener('pointerdown',e=>{e.preventDefault();sneak=!sneak;e.currentTarget.classList.toggle('pressed',sneak);});
function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock.getDelta());seconds+=dt;glow.material.opacity=.3+.18*(.5+.5*Math.sin(seconds*2.2));ring.rotation.y=Math.sin(seconds*.45)*.08;for(const p of palms)p.rotation.z=Math.sin(seconds*.8+p.userData.phase)*.018;for(const r of ripples){r.scale.setScalar(.82+.16*Math.sin(r.userData.phase+seconds*.45));r.material.opacity=.2+.15*(.5+.5*Math.sin(r.userData.phase+seconds*.45));}for(const e of entities)if(e.kind==='herbivore'){e.phase+=dt*2;e.group.position.y=Math.sin(e.phase)*.025;}move(dt);for(const e of entities)if(e.pred)predator(e,dt);player.position.y=Math.max(0,.02+Math.sin(seconds*7)*(keys.size?.025:0));camera.position.set(player.position.x,29,player.position.z+31);camera.lookAt(player.position.x,0,player.position.z);if(toastUntil<performance.now())document.getElementById('toast').classList.remove('visible');if(Math.floor(seconds*4)!==Math.floor((seconds-dt)*4))drawMap();renderer.render(scene,camera);}drawMap();updateQuest();say('Explore a ilha, evite os cones vermelhos e encontre três fósseis. O portal está marcado no mapa.',5);animate();
